name: FPV Tracker Android

on:
  workflow_dispatch:
  push:
    branches:
      - fpv-tracker-android
    paths:
      - 'FPV_Tracker_Android/**'
      - '.github/workflows/fpv-tracker-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FPV_Tracker_Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Gradle help
        run: gradle help --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPV-Tracker-debug
          path: FPV_Tracker_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
