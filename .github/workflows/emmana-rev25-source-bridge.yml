name: EMMana rev25 source bridge
on:
  push:
    branches: [ emmana-next-alpha20 ]
    paths:
      - '.github/workflows/emmana-rev25-source-bridge.yml'
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact rev25 source from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://ucfcc70dbd45e59596046e694825.dl.dropboxusercontent.com/cd/0/get/DIpxndLPchzTtBsKahUR8Ni4Q_ArQnkbYe3mGCk6uTdNWyyE7oo7HDztzNPslBBAq0BMkUQZthuQzaqBXFY7BOvwxcM35gR-pTxUPynreb8z0h1xkE3q9dKf3gArExPAptoPSW3-a9jjlbjZ6vRabC6sODNSwjgJzhUUyEojJn46RA/file?c_luid=cfbe8875' -o rev25-source.zip
          echo '31c19421cc8088bbc0ed52a8ca7455a485f795ddad7a8eb0a6002d102b38c6d5  rev25-source.zip' | sha256sum -c -
      - name: Upload exact rev25 source
        uses: actions/upload-artifact@v4
        with:
          name: emmana-rev25-source-bridge
          path: rev25-source.zip
          if-no-files-found: error
          retention-days: 1
