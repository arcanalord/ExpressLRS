name: Mesh Messenger dev.10 Android Emulator Video QA

on:
  workflow_dispatch:
  push:
    branches:
      - build/mesh-flutter-v0.1.10-dev.10
    paths:
      - '.github/workflows/mesh-flutter-v0.1.10-dev.10-emulator-video.yml'
      - '.ci/mesh-v0110/dev5-overlay/**'
      - '.ci/mesh-v0110/emulator_video_qa.sh'

concurrency:
  group: mesh-flutter-v0.1.10-dev.10-emulator-video
  cancel-in-progress: true

jobs:
  emulator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct current Flutter source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-dev10
          base64 -d .ci/mesh-v0110/source_v0110_dev3.zip.b64 > /tmp/mesh-dev10/source.zip
          echo '38a92c9c3873239c7db9c472800e4229d60a8a539bbb964b057e03029eebcda4  /tmp/mesh-dev10/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-dev10/source.zip -d /tmp/mesh-dev10/unpacked
          ROOT="$(find /tmp/mesh-dev10/unpacked -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          APP_DIR="$ROOT/flutter_app"
          cp -a .ci/mesh-v0110/dev5-overlay/. "$APP_DIR/"
          sed -i 's/^version: .*/version: 0.1.10-dev.10+26092601/' "$APP_DIR/pubspec.yaml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies and map runtime
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          python3 tool/fetch_map_vendor.py
          python3 tool/map_vendor_gate.py

      - name: Build Android debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator smoke + video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .ci/mesh-v0110/emulator_video_qa.sh

      - name: Verify video
        run: |
          set -euo pipefail
          EVIDENCE=/tmp/mesh-dev10-emulator-evidence
          test -s "$EVIDENCE/MeshMessenger-v0.1.10-dev.10-emulator-smoke.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$EVIDENCE/MeshMessenger-v0.1.10-dev.10-emulator-smoke.mp4"
          sha256sum "$EVIDENCE/MeshMessenger-v0.1.10-dev.10-emulator-smoke.mp4" > "$EVIDENCE/SHA256SUM_VIDEO.txt"

      - name: Upload emulator QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-v0.1.10-dev.10-emulator-video-QA
          path: /tmp/mesh-dev10-emulator-evidence/
          if-no-files-found: error
          retention-days: 14
