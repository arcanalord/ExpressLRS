name: Mesh Messenger Flutter Android v0.1.10-dev.15-channel

on:
  push:
    branches:
      - feature/mesh-lr24-usb
    paths:
      - '.github/workflows/mesh-flutter-general-dev15.yml'
      - '.ci/mesh-v0110/dev5-overlay/**'
  workflow_dispatch:

concurrency:
  group: mesh-flutter-v0.1.10-dev.15-channel
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct stable dev.5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-dev5
          base64 -d .ci/mesh-v0110/source_v0110_dev3.zip.b64 > /tmp/mesh-dev5/source.zip
          echo '38a92c9c3873239c7db9c472800e4229d60a8a539bbb964b057e03029eebcda4  /tmp/mesh-dev5/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-dev5/source.zip -d /tmp/mesh-dev5/unpacked
          ROOT="$(find /tmp/mesh-dev5/unpacked -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          APP_DIR="$ROOT/flutter_app"
          cp -a .ci/mesh-v0110/dev5-overlay/. "$APP_DIR/"
          sed -i 's/^version: .*/version: 0.1.10-dev.15-channel+26092703/' "$APP_DIR/pubspec.yaml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Fetch pinned offline map runtime
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tool/fetch_map_vendor.py
          python3 tool/map_vendor_gate.py

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run tool/core_self_test.dart
          dart run tool/general_channel_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: MapPoint self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/map_point_self_test.dart

      - name: Storage concurrency self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/storage_concurrency_self_test.dart

      - name: Identity pairing self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/identity_pairing_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: UART protocol self tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run tool/radio_uart_probe_self_test.dart
          dart run tool/mm_uart_1_self_test.dart
          dart run tool/mm_uart_codec_self_test.dart
          dart run tool/mm_serial_lr24_self_test.dart
          dart run tool/usb_profile_binding_self_test.dart
          dart run tool/radio_capability_self_test.dart
          dart run tool/settings_registry_self_test.dart
          dart run tool/meshtastic_config_adapter_self_test.dart
          dart run tool/mm_uart_session_self_test.dart
          dart run tool/mm_two_node_radio_sim_test.dart
          dart run tool/device_recognition_self_test.dart
          python3 tool/mm_uart_common_radio_source_gate.py
          grep -q "implements MmUartHostLink" lib/platform/android_usb_mm_uart_host_link.dart
          grep -q "MM-UART/1 first" lib/src/application/mesh_app_controller.dart
          grep -q "session.supportsMmrp" lib/src/application/mesh_app_controller.dart

      - name: Source gates
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart format lib/core/models.dart lib/core/app_storage.dart lib/core/delivery.dart lib/core/messenger_core.dart lib/core/settings_registry.dart lib/platform/meshtastic_config_adapter.dart lib/src/app.dart lib/src/features/settings/settings_page.dart tool/general_channel_self_test.dart tool/settings_registry_self_test.dart tool/meshtastic_config_adapter_self_test.dart lib/core/usb_profile_binding.dart lib/platform/usb_profile_binding_store.dart lib/platform/mm_uart_external_radio_session.dart lib/platform/mm_uart_hil_bench.dart lib/platform/mm_serial_codec.dart lib/platform/transparent_uart_radio_transport.dart lib/src/application/mesh_app_controller.dart lib/src/features/chats/chats_page.dart lib/src/features/connection/connection_page.dart tool/usb_profile_binding_self_test.dart
          python3 tool/android_source_gate.py
          python3 tool/ep2_uart_source_gate.py
          python3 tool/uart_diagnostics_source_gate.py
          python3 tool/lan_source_gate.py
          python3 tool/identity_source_gate.py
          python3 tool/map_source_gate.py
          python3 tool/release_ui_gate.py
          grep -q "waiting profile selection; no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "runRadioSelfTest" lib/src/application/mesh_app_controller.dart
          grep -q "session.enterOta" lib/src/application/mesh_app_controller.dart
          grep -q "Всё работает" lib/src/features/connection/connection_page.dart
          grep -q "runRadioHil" lib/src/application/mesh_app_controller.dart
          grep -q "Тест 1000" lib/src/features/connection/connection_page.dart
          grep -q "MM_UART_HIL_100_PASS" tool/mm_two_node_radio_sim_test.dart
          grep -q "class TransparentUartRadioTransport" lib/platform/transparent_uart_radio_transport.dart
          grep -q "MicoAir LR24-F" lib/src/features/connection/connection_page.dart
          grep -q "no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "saved LR24 binding matched; no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "USB_PROFILE_BINDING_PASS" tool/usb_profile_binding_self_test.dart
          grep -q "ConversationRef.channel" lib/core/models.dart
          grep -q "channel_data" lib/platform/transparent_uart_radio_transport.dart
          grep -q "Общий чат" lib/src/features/chats/chats_page.dart
          grep -q "MESH_MESSENGER_GENERAL_CHANNEL_SELF_TEST_PASS" tool/general_channel_self_test.dart

      - name: Widget tests (diagnostic, non-blocking for device test APK)
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: timeout 90s flutter test test/connection_page_test.dart --reporter expanded --timeout 60s

      - name: Build installable arm64 debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify and package APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee /tmp/APK_BADGING.txt
          grep -Fq "package: name='org.fpvclub.mesh.flutter'" /tmp/APK_BADGING.txt
          grep -Fq "versionCode='26092703'" /tmp/APK_BADGING.txt
          grep -Fq "versionName='0.1.10-dev.15-channel'" /tmp/APK_BADGING.txt
          unzip -Z1 "$APK" > /tmp/APK_FILES.txt
          grep -Fq 'lib/arm64-v8a/' /tmp/APK_FILES.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/APK_FILES.txt; then
            echo "Unexpected non-arm64 ABI in APK" >&2
            exit 1
          fi
          cp "$APK" /tmp/MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug.apk | tee /tmp/SHA256SUM-v0.1.10-dev.15-channel.txt
          APK_SHA256="$(sha256sum /tmp/MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug.apk | awk '{print $1}')"
          export APK_SHA256
          python3 - <<'PY'
          import json
          import os
          manifest = {
              "schema": "mesh-messenger-release-manifest/v1",
              "version": "0.1.10-dev.15-channel",
              "versionCode": 26092703,
              "applicationId": "org.fpvclub.mesh.flutter",
              "abi": ["arm64-v8a"],
              "git": {
                  "repository": "arcanalord/ExpressLRS",
                  "branch": "feature/mesh-lr24-usb",
                  "commit": os.environ["GITHUB_SHA"],
                  "workflow": "mesh-flutter-general-dev15.yml",
                  "runId": os.environ["GITHUB_RUN_ID"],
              },
              "artifact": {
                  "file": "MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug.apk",
                  "sha256": os.environ["APK_SHA256"],
              },
              "gates": {
                  "analyze": "PASS",
                  "selfTests": "PASS",
                  "widgetTests": "PENDING",
                  "apkVerify": "PASS",
                  "physicalLr24Hil": "PENDING",
                  "release": "PENDING",
              },
              "limitations": [
                  "Physical two-phone/two-LR24-F general-channel RF HIL is still required.",
                  "Multi-hop and additional logical channels are architecture-ready but not physically validated in this build.",
                  "LR24-F TX power control is not claimed.",
                  "LR24-F RTT is not distance/ranging.",
              ],
          }
          with open("/tmp/mesh-messenger-release-manifest-v1.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.10-dev.15-channel-arm64-debug.apk
            /tmp/SHA256SUM-v0.1.10-dev.15-channel.txt
            /tmp/mesh-messenger-release-manifest-v1.json
          if-no-files-found: error
          retention-days: 14
