name: Mesh Messenger Flutter Android v0.6.0-secure-core-rc1

on:
  workflow_dispatch:

concurrency:
  group: mesh-flutter-v0.6.0-secure-core-rc1
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct stable dev.5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-dev5
          base64 -d .ci/mesh-v0110/source_v0110_dev3.zip.b64 > /tmp/mesh-dev5/source.zip
          echo '38a92c9c3873239c7db9c472800e4229d60a8a539bbb964b057e03029eebcda4  /tmp/mesh-dev5/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-dev5/source.zip -d /tmp/mesh-dev5/unpacked
          ROOT="$(find /tmp/mesh-dev5/unpacked -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          APP_DIR="$ROOT/flutter_app"
          cp -a .ci/mesh-v0110/dev5-overlay/. "$APP_DIR/"
          grep -Fqx 'version: 0.6.0-secure-core-rc1+26092901' "$APP_DIR/pubspec.yaml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Fetch pinned offline map runtime
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tool/fetch_map_vendor.py
          python3 tool/map_vendor_gate.py

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run tool/core_self_test.dart
          dart run tool/general_channel_self_test.dart
          dart run tool/group_delivery_self_test.dart
          dart run tool/delivery_reliability_self_test.dart
          dart run tool/m12_transport_router_self_test.dart
          dart run tool/internet_relay_adapter_self_test.dart
          dart run tool/diagnostic_snapshot_self_test.dart
          dart run tool/file_transfer_core_self_test.dart
          dart run tool/file_transfer_protocol_self_test.dart
          dart run tool/contact_card_self_test.dart
          dart run tool/adaptive_link_profile_self_test.dart
          dart run tool/m07_security_contract_self_test.dart
          dart run tool/m07_private_pipeline_self_test.dart
          dart run tool/m07_atomic_recovery_self_test.dart
          dart run tool/m07_provider_state_store_self_test.dart
          dart run tool/m07_atomic_provider_self_test.dart
          dart run tool/storage_encryption_self_test.dart
          dart run tool/secure_core_policy_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: MapPoint self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/map_point_self_test.dart

      - name: Storage concurrency self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/storage_concurrency_self_test.dart

      - name: Identity pairing self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/identity_pairing_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: UART protocol self tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart run tool/radio_uart_probe_self_test.dart
          dart run tool/mm_uart_1_self_test.dart
          dart run tool/mm_uart_codec_self_test.dart
          dart run tool/mm_serial_lr24_self_test.dart
          dart run tool/usb_profile_binding_self_test.dart
          dart run tool/radio_capability_self_test.dart
          dart run tool/settings_registry_self_test.dart
          dart run tool/meshtastic_config_adapter_self_test.dart
          dart run tool/mm_uart_session_self_test.dart
          dart run tool/mm_two_node_radio_sim_test.dart
          dart run tool/device_recognition_self_test.dart
          python3 tool/mm_uart_common_radio_source_gate.py
          grep -q "implements MmUartHostLink" lib/platform/android_usb_mm_uart_host_link.dart
          grep -q "MM-UART/1 first" lib/src/application/mesh_app_controller.dart
          grep -q "session.supportsMmrp" lib/src/application/mesh_app_controller.dart

      - name: Source gates
        working-directory: ${{ env.APP_DIR }}
        run: |
          dart format --output=none --set-exit-if-changed lib/core/models.dart lib/core/m07_security.dart lib/core/secure_core_policy.dart lib/core/local_storage_crypto.dart lib/core/m07_provider_state_store.dart lib/core/m07_atomic_provider.dart lib/core/app_storage.dart lib/core/delivery.dart lib/core/messenger_core.dart lib/core/m12_transport_router.dart lib/platform/internet_relay_contract.dart lib/platform/internet_relay_adapter.dart lib/platform/android_app_storage_crypto.dart lib/core/settings_registry.dart lib/platform/meshtastic_config_adapter.dart lib/src/app.dart lib/src/features/settings/settings_page.dart tool/general_channel_self_test.dart tool/group_delivery_self_test.dart tool/delivery_reliability_self_test.dart tool/m12_transport_router_self_test.dart tool/internet_relay_adapter_self_test.dart tool/diagnostic_snapshot_self_test.dart lib/core/diagnostic_snapshot.dart tool/settings_registry_self_test.dart tool/meshtastic_config_adapter_self_test.dart lib/core/usb_profile_binding.dart lib/platform/usb_profile_binding_store.dart lib/platform/mm_uart_external_radio_session.dart lib/platform/mm_uart_hil_bench.dart lib/platform/mm_serial_codec.dart lib/core/file_transfer_session.dart lib/platform/file1_transport_bridge.dart lib/platform/transparent_uart_radio_transport.dart lib/src/application/mesh_app_controller.dart lib/src/features/chats/chats_page.dart lib/src/features/contacts/contact_share_dialog.dart lib/src/features/connection/connection_page.dart tool/usb_profile_binding_self_test.dart lib/core/contact_card.dart lib/core/adaptive_link_profile.dart tool/contact_card_self_test.dart tool/adaptive_link_profile_self_test.dart tool/m07_security_contract_self_test.dart tool/m07_private_pipeline_self_test.dart tool/m07_atomic_recovery_self_test.dart tool/m07_provider_state_store_self_test.dart tool/m07_atomic_provider_self_test.dart tool/storage_encryption_self_test.dart tool/secure_core_policy_self_test.dart tool/file_transfer_core_self_test.dart tool/file_transfer_protocol_self_test.dart test/app_shell_navigation_test.dart
          python3 tool/android_source_gate.py
          python3 tool/ep2_uart_source_gate.py
          python3 tool/uart_diagnostics_source_gate.py
          python3 tool/lan_source_gate.py
          python3 tool/identity_source_gate.py
          python3 tool/map_source_gate.py
          python3 tool/release_ui_gate.py
          grep -q "waiting profile selection; no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "runRadioSelfTest" lib/src/application/mesh_app_controller.dart
          grep -q "session.enterOta" lib/src/application/mesh_app_controller.dart
          grep -q "Всё работает" lib/src/features/connection/connection_page.dart
          grep -q "runRadioHil" lib/src/application/mesh_app_controller.dart
          grep -q "Тест 1000" lib/src/features/connection/connection_page.dart
          grep -q "MM_UART_HIL_100_PASS" tool/mm_two_node_radio_sim_test.dart
          grep -q "class TransparentUartRadioTransport" lib/platform/transparent_uart_radio_transport.dart
          grep -q "MicoAir LR24-F" lib/src/features/connection/connection_page.dart
          grep -q "no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "saved LR24 binding matched; no active probe" lib/src/application/mesh_app_controller.dart
          grep -q "USB_PROFILE_BINDING_PASS" tool/usb_profile_binding_self_test.dart
          grep -q "ConversationRef.channel" lib/core/models.dart
          grep -q "ConversationRef.group" lib/core/models.dart
          grep -q "group_data" lib/platform/transparent_uart_radio_transport.dart
          grep -q "group_descriptor" lib/platform/transparent_uart_radio_transport.dart
          grep -q "discoverPeers" lib/platform/transparent_uart_radio_transport.dart
          grep -q "LR24_PEER_NOT_REACHABLE" lib/platform/transparent_uart_radio_transport.dart
          grep -q "groupRevision" lib/core/models.dart
          grep -q "Новая группа" lib/src/features/chats/chats_page.dart
          grep -q "MESH_MESSENGER_GROUP_DELIVERY_SELF_TEST_PASS" tool/group_delivery_self_test.dart
          grep -q "MESH_MESSENGER_M02_RELIABLE_DELIVERY_PASS" tool/delivery_reliability_self_test.dart
          grep -q "MESH_MESSENGER_M12_RELAY_CONTRACT_PASS" tool/m12_transport_router_self_test.dart
          grep -q "MESH_MESSENGER_INTERNET_RELAY_ADAPTER_PASS" tool/internet_relay_adapter_self_test.dart
          grep -q "MM-RELAY/1" lib/platform/internet_relay_contract.dart
          grep -q "isRecipientDelivered => false" lib/platform/internet_relay_contract.dart
          ! grep -q "Тестовый ACK" lib/src/features/chats/chats_page.dart
          grep -q "channel_data" lib/platform/transparent_uart_radio_transport.dart
          grep -q "Общий чат" lib/src/features/chats/chats_page.dart
          grep -q "MESH_MESSENGER_GENERAL_CHANNEL_SELF_TEST_PASS" tool/general_channel_self_test.dart
          grep -q "MESH_MESSENGER_DIAGNOSTIC_SNAPSHOT_PASS" tool/diagnostic_snapshot_self_test.dart
          grep -q "MESH_MESSENGER_CONTACT_CARD_SELF_TEST_PASS" tool/contact_card_self_test.dart
          grep -q "MESH_MESSENGER_ADAPTIVE_LINK_SELF_TEST_PASS" tool/adaptive_link_profile_self_test.dart
          grep -q "abstract interface class M07CryptoProvider" lib/core/m07_security.dart
          grep -q "M07_SECURITY_CONTRACT_PASS" tool/m07_security_contract_self_test.dart
          grep -q "M07_PRIVATE_PIPELINE_PASS" tool/m07_private_pipeline_self_test.dart
          grep -q "M07_ATOMIC_RECOVERY_PASS" tool/m07_atomic_recovery_self_test.dart
          grep -q "M07_PROVIDER_STATE_STORE_PASS" tool/m07_provider_state_store_self_test.dart
          grep -q "M07_ATOMIC_PROVIDER_ADAPTER_PASS" tool/m07_atomic_provider_self_test.dart
          grep -q "abstract interface class M07DirectRatchetEngine" lib/core/m07_atomic_provider.dart
          grep -q "mesh-messenger-m07-provider-state/v1" lib/core/m07_provider_state_store.dart
          grep -q "abstract interface class M07AtomicCryptoProvider" lib/core/m07_security.dart
          grep -q "LOCAL_STORAGE_ENCRYPTION_SELF_TEST_PASS" tool/storage_encryption_self_test.dart
          grep -q "SECURE_CORE_POLICY_PASS" tool/secure_core_policy_self_test.dart
          grep -q "mesh-messenger-local-storage/v1" lib/core/app_storage.dart
          grep -q "AndroidAppStorageCrypto" lib/src/application/mesh_app_controller.dart
          grep -q "AES/GCM/NoPadding" android/app/src/main/kotlin/org/fpvclub/mesh/SecureStorageCipher.kt
          grep -q "AndroidKeyStore" android/app/src/main/kotlin/org/fpvclub/mesh/SecureStorageCipher.kt
          grep -q "m07DirectEnvelopeClass" lib/core/messenger_core.dart
          grep -q "m07DirectEnvelopeClass" lib/platform/transparent_uart_radio_transport.dart
          grep -q "m07DirectEnvelopeClass" lib/platform/lan_transport.dart
          grep -q "m07DirectEnvelopeClass" lib/platform/mm_uart_message_transport.dart
          grep -q "Голосовое сообщение" lib/src/features/chats/chats_page.dart
          grep -q "Выбрать точку на карте" lib/src/features/chats/chats_page.dart
          grep -q "mesh-messenger-file/v1" lib/core/file_transfer_core.dart
          ! grep -q "mm:demo-alexey" lib/src/application/mesh_app_controller.dart
          grep -q "createForWidgetTest" lib/src/application/mesh_app_controller.dart
          grep -q "IndexedStack" lib/src/app.dart
          grep -q "rapid tab switching keeps inherited dependencies stable" test/app_shell_navigation_test.dart
          grep -q "sendPreparedSmallFile" lib/src/features/chats/chats_page.dart
          grep -q "cancelPreparedFileTransfer" lib/src/application/mesh_app_controller.dart
          grep -q "TransparentUartFileProgress" lib/platform/transparent_uart_radio_transport.dart
          grep -q "File1TransportProgress" lib/platform/file1_transport_bridge.dart
          grep -q "Повторить передачу" lib/src/features/chats/chats_page.dart
          grep -q "Показать мой QR" lib/src/features/chats/chats_page.dart
          grep -q "Сканировать чужой QR" lib/src/features/chats/chats_page.dart
          grep -q "contact add QR and manual routes survive repeated open close" test/app_shell_navigation_test.dart
          grep -q "general location handoff opens map without contact assertion" test/app_shell_navigation_test.dart
          grep -q "_completedReceiverAtMs" lib/platform/file1_transport_bridge.dart
          grep -q "sendChannelMapPoint" lib/core/messenger_core.dart
          grep -q "Планируемые разделы" lib/src/features/settings/settings_page.dart
          grep -q "android.permission.CAMERA" android/app/src/debug/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.xml

      - name: Widget tests
        working-directory: ${{ env.APP_DIR }}
        run: timeout 180s flutter test test/connection_page_test.dart test/app_shell_navigation_test.dart --reporter expanded --timeout 90s

      - name: Build installable arm64 test APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Verify and package APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee /tmp/APK_BADGING.txt
          grep -Fq "package: name='org.fpvclub.mesh.flutter'" /tmp/APK_BADGING.txt
          APK_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" /tmp/APK_BADGING.txt | head -n1)"
          test -n "$APK_VERSION_CODE"
          export APK_VERSION_CODE
          grep -Fq "versionName='0.6.0-secure-core-rc1'" /tmp/APK_BADGING.txt
          unzip -Z1 "$APK" > /tmp/APK_FILES.txt
          grep -Fq 'lib/arm64-v8a/' /tmp/APK_FILES.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' /tmp/APK_FILES.txt; then
            echo "Unexpected non-arm64 ABI in APK" >&2
            exit 1
          fi
          cp "$APK" /tmp/MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug.apk | tee /tmp/SHA256SUM-v0.6.0-secure-core-rc1.txt
          APK_SHA256="$(sha256sum /tmp/MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug.apk | awk '{print $1}')"
          export APK_SHA256
          python3 - <<'PY'
          import json
          import os
          manifest = {
              "schema": "mesh-messenger-release-manifest/v1",
              "version": "0.6.0-secure-core-rc1",
              "versionCode": int(os.environ["APK_VERSION_CODE"]),
              "applicationId": "org.fpvclub.mesh.flutter",
              "abi": ["arm64-v8a"],
              "git": {
                  "repository": "arcanalord/ExpressLRS",
                  "branch": os.environ.get("GITHUB_REF_NAME", "security/secure-core-v1-integration"),
                  "commit": os.environ["GITHUB_SHA"],
                  "workflow": "mesh-flutter-general-dev15.yml",
                  "runId": os.environ["GITHUB_RUN_ID"],
              },
              "artifact": {
                  "file": "MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug.apk",
                  "sha256": os.environ["APK_SHA256"],
              },
              "gates": {
                  "analyze": "PASS",
                  "selfTests": "PASS",
                  "widgetTests": "PASS",
                  "apkVerify": "PASS",
                  "physicalLr24Hil": "PENDING",
                  "release": "BLOCKED_UNTIL_PRODUCTION_M07_PROVIDER",
              },
              "limitations": [
                  "This is a debug/test APK, not a production release.",
                  "Production private E2EE remains blocked until a concrete crash-atomic M07 provider is wired.",
                  "Physical two-phone/two-LR24-F general-channel RF HIL is still required.",
                  "Multi-hop and additional logical channels are architecture-ready but not physically validated in this build.",
                  "LR24-F TX power control is not claimed.",
                  "LR24-F RTT is not distance/ranging.",
              ],
          }
          with open("/tmp/mesh-messenger-release-manifest-v1.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.6.0-secure-core-rc1-arm64-debug.apk
            /tmp/SHA256SUM-v0.6.0-secure-core-rc1.txt
            /tmp/mesh-messenger-release-manifest-v1.json
          if-no-files-found: error
          retention-days: 14
