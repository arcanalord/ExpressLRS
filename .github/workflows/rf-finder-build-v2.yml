name: RF Finder build v2

on:
  push:
    branches:
      - rf-finder-nano-v0.3.0
    paths:
      - 'rf_finder/**'
      - '.github/workflows/rf-finder-build-v2.yml'
  workflow_dispatch:

jobs:
  firmware:
    name: ESP8285 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build Nano RX firmware
        working-directory: rf_finder/firmware
        run: pio run -e elrs_nano_esp8285
      - name: Prepare firmware artifact
        run: |
          mkdir -p out/firmware
          cp rf_finder/firmware/.pio/build/elrs_nano_esp8285/firmware.bin out/firmware/RF_Finder_Nano_RX_v0.3.0.bin
          sha256sum out/firmware/RF_Finder_Nano_RX_v0.3.0.bin > out/firmware/RF_Finder_Nano_RX_v0.3.0.bin.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: RF-Finder-Nano-RX-v0.3.0
          path: out/firmware/*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        working-directory: rf_finder/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare Android artifact
        run: |
          mkdir -p out/android
          cp rf_finder/android/app/build/outputs/apk/debug/app-debug.apk out/android/RF_Finder_Android_v0.3.0-debug.apk
          sha256sum out/android/RF_Finder_Android_v0.3.0-debug.apk > out/android/RF_Finder_Android_v0.3.0-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: RF-Finder-Android-v0.3.0
          path: out/android/*
