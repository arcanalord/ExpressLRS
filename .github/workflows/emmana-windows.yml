name: EMMana Windows x64 verification

on:
  workflow_dispatch:
  push:
    branches: [ emmana-next-alpha20 ]
    paths:
      - 'EMMana-Next/**'
      - '.github/workflows/emmana-windows.yml'

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        working-directory: EMMana-Next
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-json:x64-windows-static eigen3:x64-windows-static
      - name: Configure MSVC x64
        shell: pwsh
        run: >-
          cmake -S . -B build-win -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DEMNEXT_REQUIRE_EIGEN=ON
      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release --parallel 2
      - name: C++ regression gates
        shell: pwsh
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: Build portable Windows launcher
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name EMMana-Next --hidden-import json --hidden-import hashlib --hidden-import importlib.util --hidden-import math --hidden-import subprocess --hidden-import tempfile --hidden-import urllib.parse --hidden-import http --hidden-import http.server --hidden-import cmath --hidden-import csv --hidden-import io --hidden-import re --hidden-import typing --add-binary "build-win/Release/emnext.exe;EMMana-Next" --add-data "apps;EMMana-Next/apps" --add-data "benchmarks;EMMana-Next/benchmarks" --add-data "schemas;EMMana-Next/schemas" --add-data "VERSION;EMMana-Next" apps/windows_launcher.py
      - name: Portable launcher runtime gate
        shell: pwsh
        run: |
          $port = 8799
          $stdout = Join-Path $PWD "portable-stdout.log"
          $stderr = Join-Path $PWD "portable-stderr.log"
          $proc = Start-Process -FilePath "dist/EMMana-Next.exe" -ArgumentList "--no-browser","--port","$port" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ok = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                Write-Host "Portable launcher exited early code=$($proc.ExitCode)"
                break
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.ok -and $health.version -eq (Get-Content VERSION).Trim()) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              if (Test-Path $stdout) { Write-Host "--- portable stdout ---"; Get-Content $stdout }
              if (Test-Path $stderr) { Write-Host "--- portable stderr ---"; Get-Content $stderr }
              throw "Portable launcher /api/health did not become ready"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 5
            if ($page.Content -notmatch "geometry-canvas") { throw "Portable UI missing geometry editor" }
            if ($page.Content -notmatch "geometry-template-create") { throw "Portable UI missing template workflow" }
            Write-Host "WINDOWS_PORTABLE_PASS version=$($health.version)"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Package Windows verification build
        shell: pwsh
        run: |
          $pkg = "dist/EMMana-Next-$((Get-Content VERSION).Trim())-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/EMMana-Next.exe $pkg/EMMana-Next.exe
          Copy-Item build-win/Release/emnext.exe $pkg/emnext-cli.exe
          Copy-Item VERSION $pkg/
          $readme = @("EMMana-Next Portable Windows","","Double-click EMMana-Next.exe.","It starts locally on 127.0.0.1 and opens your default browser.","No separate Python installation is required.","","emnext-cli.exe is included for diagnostics.")
          $readme | Set-Content -Encoding UTF8 "$pkg/README-WINDOWS.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: emmana-windows-x64
          path: EMMana-Next/dist/*.zip
          if-no-files-found: error
