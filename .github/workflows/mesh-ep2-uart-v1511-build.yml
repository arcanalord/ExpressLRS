name: Mesh Messenger EP2 UART 1.5.11 APK

on:
  push:
    branches: [build/mesh-ep2-uart-v1.5.11]
    paths:
      - ".github/workflows/mesh-ep2-uart-v1511-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-ep2-uart-v1511
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Fetch exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _v1511/src _v1511/out
          curl -L --fail --retry 3 'https://uca97ab8fba9fa661571d2f90590.dl.dropboxusercontent.com/cd/0/get/DIqCWE_rtpcYJTwfD5TLkXgmmtstBFSii5qT7VTXEUf9npDZiF0Fh_64YWaZU5PKulgwJgCzzcEeMajl4oMSwYb-80f5SASJmyMuGTKNrYZwKV8hMUr7e58kEDZ58ysiLmmhtsUUjThae5Cj-QiA4MY9FiGsqZPAN672yMPRenC8mQ/file?c_luid=cfbe8875' -o _v1511/source.zip
          echo '34561c8e448ba762515333c18b80b9149e28265eeaf144f2bbaca683bdddcac0  _v1511/source.zip' | sha256sum -c -
          unzip -q _v1511/source.zip -d _v1511/src

      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/_v1511/src"
          node --check "$ROOT/src/app.js"
          node --check "$ROOT/src/help-registry.js"
          node --check "$ROOT/src/transports/android-external-radio.js"
          node --check "$ROOT/src/transports/external-radio/mm-uart-codec.js"
          node "$ROOT/tests/core.test.mjs"
          node "$ROOT/tests/m02_real_queue_integration.test.mjs"
          node "$ROOT/tests/help-registry.test.mjs"
          bash "$ROOT/tests/android_app_source_check.sh"

      - name: Build Android
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/_v1511/src"
          gradle -p "$ROOT/android-app" --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/_v1511/src"
          APK="$ROOT/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee _v1511/out/aapt-badging.txt
          grep -q "versionCode='27'" _v1511/out/aapt-badging.txt
          grep -q "versionName='1.5.11'" _v1511/out/aapt-badging.txt
          cp "$APK" _v1511/out/MeshMessenger-1.5.11-EP2-UART-debug.apk
          sha256sum _v1511/out/MeshMessenger-1.5.11-EP2-UART-debug.apk > _v1511/out/APK_SHA256.txt
          printf 'candidate=1.5.11_EP2_UART\nversionName=1.5.11\nversionCode=27\nbaseline=v1.5.9\nphone_pass=PENDING\nusb_uart_hardware=PENDING\nep2_rf=PENDING\n' > _v1511/out/BUILD_RESULT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mesh-messenger-1.5.11-ep2-uart-apk
          path: _v1511/out/*
          retention-days: 30
