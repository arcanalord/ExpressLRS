name: Mesh Messenger Flutter Android v0.1.10-dev.1

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
      - '.ci/mesh-v0110/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact v0.1.10-dev.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          base64 -d .ci/mesh-v0110/source_v0110_dev1.zip.b64 > /tmp/mesh-src/source.zip
          echo 'a0676bfa55fb1c27552e7b88e3b738c4124ee061e6e92811329645d7b857c8ca  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.10-dev.1/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: Identity pairing self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/identity_pairing_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android transport source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: EP2 UART source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/ep2_uart_source_gate.py

      - name: LAN source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/lan_source_gate.py

      - name: Identity source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/identity_source_gate.py

      - name: Build arm64 release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify arm64 APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          cp "$APK" /tmp/MeshMessenger-Flutter-v0.1.10-dev.1-arm64-release.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.10-dev.1-arm64-release.apk | tee /tmp/SHA256SUM-v0.1.10-dev.1.txt
          stat -c '%n %s bytes' /tmp/MeshMessenger-Flutter-v0.1.10-dev.1-arm64-release.apk | tee /tmp/SIZE-v0.1.10-dev.1.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.10-dev.1-arm64-release
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.10-dev.1-arm64-release.apk
            /tmp/SHA256SUM-v0.1.10-dev.1.txt
            /tmp/SIZE-v0.1.10-dev.1.txt
          if-no-files-found: error
          retention-days: 14
