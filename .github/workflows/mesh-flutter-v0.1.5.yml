name: Mesh Messenger Flutter APK v0.1.6

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          cat .ci/mesh-v016/source.b64.part00 .ci/mesh-v016/source.b64.part01 .ci/mesh-v016/source.b64.part02 .ci/mesh-v016/source.b64.part03 .ci/mesh-v016/p4s00 .ci/mesh-v016/p4s01 .ci/mesh-v016/p4s02 .ci/mesh-v016/p4s03 .ci/mesh-v016/p4s04 .ci/mesh-v016/p4s05 | base64 -d > /tmp/mesh-src/source.zip
          echo 'a3640109a6cc74e2a0abf637d829ea322a00ed5d1cc5a6a421026ef129d59b6d  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.6-dev.1/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/MeshMessenger-Flutter-v0.1.6-dev.1-debug.apk.sha256
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.6-dev.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.6-dev.1-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.6-dev.1-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.6-dev.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
