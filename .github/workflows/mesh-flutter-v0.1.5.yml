name: Mesh Messenger Flutter APK v0.1.7-dev.2

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          curl -L --fail --retry 2 -o /tmp/mesh-src/source.zip 'https://ucf61ec546ce597b64c0b4380974.dl.dropboxusercontent.com/cd/0/get/DIq721hgRMSw3oG0q4LKon_00gl6CngQMkFVgH_Td425KpVPEliHlDkbhEKa7KwHbM1EphIUcEKBMJcydM0Q1qntP1JDZe78N7D_cBndzx-mU4XoRAeSyOHGyYfB1OAfK9hdBYSjZxOup9PVtDL_WSFjW3s2kYCF7l7Zl5zh9hRR1g/file?c_luid=cfbe8875'
          echo '31c331603762998bf3e71977813f800af122bb483c8a06535476ea9dd914c5cd  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.7-dev.2/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android transport source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: EP2 UART source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/ep2_uart_source_gate.py

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.7-dev.2-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.7-dev.2-debug.apk | tee /tmp/MeshMessenger-Flutter-v0.1.7-dev.2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.7-dev.2-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.7-dev.2-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.7-dev.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
