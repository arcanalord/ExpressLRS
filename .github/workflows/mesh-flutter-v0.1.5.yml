name: Mesh Messenger Flutter APK v0.1.8-dev.3

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
      - '.ci/mesh-v018/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact v0.1.8-dev.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          base64 -d .ci/mesh-v018/source_v018_dev3.zip.b64 > /tmp/mesh-src/source.zip
          echo 'a7ffe62465fbdebc1a94e65376ed629d9c2b173f8281742c4799bc1559b1a158  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.8-dev.3/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android transport source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: EP2 UART source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/ep2_uart_source_gate.py

      - name: LAN source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/lan_source_gate.py

      - name: Connection UI widget test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test test/connection_page_test.dart

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.8-dev.3-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.8-dev.3-debug.apk | tee /tmp/MeshMessenger-Flutter-v0.1.8-dev.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.8-dev.3-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.8-dev.3-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.8-dev.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
