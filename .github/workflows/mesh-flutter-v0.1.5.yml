name: Mesh Messenger Flutter APK v0.1.7-dev.3

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          curl -L --fail --retry 2 -o /tmp/mesh-src/source.zip 'https://uc7eb8a077b53e19a2f0d3b95019.dl.dropboxusercontent.com/cd/0/get/DIoQtEey7E620UU93JKkE5TZ4mFmPg4iZ3YRF-P0czM016OOND0ozQ66amHK7_E2w3nb6TJpPBRSrkj_9FXIS-DHg4Yd3d9QhO1X9uGB5WLmyuY1YOuFDUgj_D6nka_lH9yDTdKol5KmCoGtsNqUBjAhgEWmYKPUmr28yILI1FMu2g/file?c_luid=cfbe8875'
          echo '91f7039be42d85697600e2e59f9466249c3b851a0a53b21a74dc28f6a0866b42  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.7-dev.3/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android transport source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: EP2 UART source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/ep2_uart_source_gate.py

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.7-dev.3-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.7-dev.3-debug.apk | tee /tmp/MeshMessenger-Flutter-v0.1.7-dev.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.7-dev.3-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.7-dev.3-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.7-dev.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
