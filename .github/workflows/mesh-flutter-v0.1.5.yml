name: Mesh Messenger Flutter APK v0.1.5

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical source snapshot from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          curl -L --fail --retry 2 -o /tmp/mesh-src/source.zip 'https://uc8411f0f99b92cdb151c4019471.dl.dropboxusercontent.com/cd/0/get/DInfBBq4M_pntvQYsLzuSr6BKnh9qIFzgtsJtLfvxsIaHw3XYIDySO_IIlqmXKXBJgPpBwdj1dRooL62MTYt7ItSFyw9U5VjjdYPjY53BkFSOIvLRCeeMd_7g6va7AtpFzNeUMHAFZI72P8AmuG8kdRux1Z2SBv7DENbns4MyzcYAg/file?c_luid=cfbe8875'
          echo '7a448e3a40fdea1b3569d1a2e3fff32eb9b79fd676cf28b72caa607c7b32713b  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          echo "APP_DIR=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.5-dev.3/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/mesh-apk.sha256
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.5-dev.3-debug.apk
          cp /tmp/mesh-apk.sha256 /tmp/MeshMessenger-Flutter-v0.1.5-dev.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.5-dev.3-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.5-dev.3-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.5-dev.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
