name: Mesh Messenger Flutter APK v0.1.8-dev.1

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.5.yml'
      - '.ci/mesh-v018/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v0.1.8 from canonical v0.1.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-src
          curl -L --fail --retry 2 -o /tmp/mesh-src/source.zip 'https://uc356c37957bb735b3a3526858d0.dl.dropboxusercontent.com/cd/0/get/DIqSmSDPV9IX7TlgFOIyYkh9l0_0mdhy1gnOFRJaAz2lAUNyt6p2azfuhO5HDpyHYfmUhAx0PhAcAqtDyTOKeucn_af5xGTJvZkvu7BStBuMh98xfH2uwdawFlK2xp8stdFOaNlZHrfHR3JJXmrDc_cb1-soBHZtbmJ34bkgER62cg/file?c_luid=cfbe8875'
          echo '91f7039be42d85697600e2e59f9466249c3b851a0a53b21a74dc28f6a0866b42  /tmp/mesh-src/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-src/source.zip -d /tmp/mesh-src/unpacked
          BASE=/tmp/mesh-src/unpacked/mesh_messenger_flutter_v0.1.7-dev.3
          base64 -d .ci/mesh-v018/overlay_exact.b64 | gzip -d > /tmp/mesh-src/v018.patch
          echo '86c8f08a841bce30be1ff80e1177e436ab60f1b85bdb3b7ebcbb711cae1033f3  /tmp/mesh-src/v018.patch' | sha256sum -c -
          cd "$BASE"
          patch -p0 < /tmp/mesh-src/v018.patch
          echo "APP_DIR=$BASE/flutter_app" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Android transport source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/android_source_gate.py

      - name: EP2 UART source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/ep2_uart_source_gate.py

      - name: LAN source gate
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/lan_source_gate.py

      - name: Connection UI widget test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test test/connection_page_test.dart

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/MeshMessenger-Flutter-v0.1.8-dev.1-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.8-dev.1-debug.apk | tee /tmp/MeshMessenger-Flutter-v0.1.8-dev.1-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.8-dev.1-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.8-dev.1-debug.apk
            /tmp/MeshMessenger-Flutter-v0.1.8-dev.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
