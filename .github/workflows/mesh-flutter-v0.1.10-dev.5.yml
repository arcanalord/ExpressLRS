name: Mesh Messenger Flutter dev.3 to dev.4 diff

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.10-dev.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.10-dev.5.yml'
  workflow_dispatch:

jobs:
  diff-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct stored dev.3 and print hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dev3
          base64 -d .ci/mesh-v0110/source_v0110_dev3.zip.b64 > /tmp/dev3/source.zip
          echo '38a92c9c3873239c7db9c472800e4229d60a8a539bbb964b057e03029eebcda4  /tmp/dev3/source.zip' | sha256sum -c -
          unzip -q /tmp/dev3/source.zip -d /tmp/dev3/unpacked
          ROOT="$(find /tmp/dev3/unpacked -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          cd "$ROOT"
          find flutter_app -type f -print0 | sort -z | xargs -0 sha256sum
