name: Mesh Messenger Flutter Android v0.1.10-dev.5

on:
  push:
    branches:
      - build/mesh-flutter-v0.1.10-dev.5
    paths:
      - '.github/workflows/mesh-flutter-v0.1.10-dev.5.yml'
      - '.ci/mesh-v0110/dev5-source-links.env'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct dev.5 source
        shell: bash
        run: |
          set -euo pipefail
          source .ci/mesh-v0110/dev5-source-links.env
          mkdir -p /tmp/mesh-dev5/base /tmp/mesh-dev5/patch
          curl -L --fail --retry 3 "$BASE_URL" -o /tmp/mesh-dev5/base.zip
          curl -L --fail --retry 3 "$PATCH_URL" -o /tmp/mesh-dev5/patch.zip
          echo '3f27358d42c73943cddd01eae926ffb0aaa4e2771eee76145a5fbb561d9917a9  /tmp/mesh-dev5/base.zip' | sha256sum -c -
          echo '3af4bdeccf07ad874e5018d43d609340c7acf91f35e50efbb6854a876e9a4fdf  /tmp/mesh-dev5/patch.zip' | sha256sum -c -
          unzip -q /tmp/mesh-dev5/base.zip -d /tmp/mesh-dev5/base
          unzip -q /tmp/mesh-dev5/patch.zip -d /tmp/mesh-dev5/patch
          ROOT="$(find /tmp/mesh-dev5/base -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          cp -a /tmp/mesh-dev5/patch/flutter_app/. "$ROOT/flutter_app/"
          APP_DIR="$ROOT/flutter_app"
          sed -i 's/^version: .*/version: 0.1.10-dev.5+26092401/' "$APP_DIR/pubspec.yaml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Fetch pinned offline map runtime
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tool/fetch_map_vendor.py
          python3 tool/map_vendor_gate.py

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Core self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/core_self_test.dart

      - name: LAN transport self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/lan_transport_self_test.dart

      - name: MapPoint self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/map_point_self_test.dart

      - name: Storage concurrency self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/storage_concurrency_self_test.dart

      - name: Identity pairing self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/identity_pairing_self_test.dart

      - name: PhoneAPI self test
        working-directory: ${{ env.APP_DIR }}
        run: dart run tool/phoneapi_self_test.dart

      - name: Source gates
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 tool/android_source_gate.py
          python3 tool/ep2_uart_source_gate.py
          python3 tool/lan_source_gate.py
          python3 tool/identity_source_gate.py
          python3 tool/map_source_gate.py
          python3 tool/release_ui_gate.py

      - name: Widget tests
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      - name: Build installable arm64 debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify and package APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          cp "$APK" /tmp/MeshMessenger-Flutter-v0.1.10-dev.5-arm64-debug.apk
          sha256sum /tmp/MeshMessenger-Flutter-v0.1.10-dev.5-arm64-debug.apk | tee /tmp/SHA256SUM-v0.1.10-dev.5.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-Flutter-v0.1.10-dev.5-arm64-debug
          path: |
            /tmp/MeshMessenger-Flutter-v0.1.10-dev.5-arm64-debug.apk
            /tmp/SHA256SUM-v0.1.10-dev.5.txt
          if-no-files-found: error
          retention-days: 14
