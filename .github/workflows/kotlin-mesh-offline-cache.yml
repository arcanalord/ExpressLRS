name: Kotlin Mesh Offline Cache Builder

on:
  workflow_dispatch:

jobs:
  warm-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 37 archive
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/platform-37.0_r01.zip \
            -o /tmp/platform-37.0_r01.zip
          mkdir -p "$ANDROID_HOME/platforms/android-37"
          unzip -q /tmp/platform-37.0_r01.zip -d /tmp/android-platform-37
          PLATFORM_DIR="$(find /tmp/android-platform-37 -type f -name android.jar -printf '%h\n' | head -n 1)"
          test -n "$PLATFORM_DIR"
          rm -rf "$ANDROID_HOME/platforms/android-37"
          cp -a "$PLATFORM_DIR" "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          ls -lh "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: false

      - name: Create dependency warmup project
        run: |
          mkdir -p warmup/app/src/main/java/org/fpvclub/cache
          cat > warmup/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven(url = "https://jitpack.io")
              }
          }
          rootProject.name = "MeshMessengerDependencyWarmup"
          include(":app")
          EOF

          cat > warmup/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.1" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.4.20" apply false
          }
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          EOF

          cat > warmup/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
              kotlin("plugin.serialization") version "2.4.20"
          }

          android {
              namespace = "org.fpvclub.cache"
              compileSdk = 37

              defaultConfig {
                  applicationId = "org.fpvclub.cache"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.0.1"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          tasks.register("warmAllDependencies") {
              doLast {
                  configurations
                      .filter { it.isCanBeResolved }
                      .forEach { configuration ->
                          println("Resolving " + configuration.name)
                          configuration.resolve()
                      }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2026.09.00"))
              implementation("androidx.activity:activity-compose:1.12.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
              implementation("com.github.mik3y:usb-serial-for-android:3.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlin:kotlin-test-junit:2.4.20")
          }
          EOF

          cat > warmup/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" />
          </manifest>
          EOF

          mkdir -p warmup/app/src/main/res/values
          cat > warmup/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > warmup/app/src/main/java/org/fpvclub/cache/Main.kt <<'EOF'
          package org.fpvclub.cache
          class Main
          EOF

      - name: Validate Android compile and warm real dependency graph
        working-directory: warmup
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace test assembleDebug 2>&1 | tee ../dependency-warmup.log

      - name: Pack offline Gradle cache
        if: always()
        run: |
          set -euxo pipefail
          test -d "$HOME/.gradle/caches"
          tar -C "$HOME" -czf kotlin-gradle-user-home-cache.tar.gz .gradle/caches
          if [ -d "$HOME/.gradle/wrapper" ]; then
            tar -C "$HOME" -rzf kotlin-gradle-user-home-cache.tar.gz .gradle/wrapper || true
          fi
          sha256sum kotlin-gradle-user-home-cache.tar.gz | tee kotlin-gradle-user-home-cache.sha256

      - name: Upload offline cache and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kotlin-Mesh-Gradle-Offline-Cache
          if-no-files-found: error
          path: |
            kotlin-gradle-user-home-cache.tar.gz
            kotlin-gradle-user-home-cache.sha256
            dependency-warmup.log
