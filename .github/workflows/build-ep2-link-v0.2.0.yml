name: Build EP2 LINK v0.2.0

on:
  push:
    branches:
      - build/ep2-positioning-v0.2.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore EP2 source
        shell: bash
        run: |
          mkdir -p /tmp/ep2src
          echo '' | base64 -d > /tmp/ep2.zip
          unzip -q /tmp/ep2.zip -d /tmp/ep2src
          sed -i 's/bool radioSend(const String& packet)/bool radioSend(String packet)/' /tmp/ep2src/src/main.cpp
          sed -i 's/ICACHE_RAM_ATTR/IRAM_ATTR/' /tmp/ep2src/src/main.cpp
          sed -i 's/void ICACHE_RAM_ATTR onRadioPacket()/void IRAM_ATTR onRadioPacket()/' /tmp/ep2src/src/main.cpp
          sed -i 's/bool radioSend(const String& packet)/bool radioSend(String packet)/' /tmp/ep2src/src/main.cpp
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run source tests
        working-directory: /tmp/ep2src
        run: |
          python3 tools/protocol_selftest.py
          python3 tools/source_selftest.py
      - name: Build firmware
        working-directory: /tmp/ep2src
        run: pio run
      - name: Verify firmware
        working-directory: /tmp/ep2src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d = Path('.pio/build/ep2_esp8285')
          raw = d / 'EP2_LINK_v0.2.0_ESP8285.bin'
          gz = d / 'EP2_LINK_v0.2.0_ESP8285.bin.gz'
          manifest = d / 'EP2_LINK_v0.2.0_MANIFEST.json'
          assert raw.exists(), raw
          assert gz.exists(), gz
          assert manifest.exists(), manifest
          marker = b'\xbe\xef\xca\xfeUNIFIED_ESP8285_2400_RX\x00'
          data = raw.read_bytes()
          assert marker in data, 'ELRS target marker missing'
          print('RAW_SIZE', raw.stat().st_size)
          print('GZ_SIZE', gz.stat().st_size)
          print(manifest.read_text())
          PY
      - name: Package compiled source and build notes
        working-directory: /tmp/ep2src
        run: |
          mkdir -p /tmp/ep2-package-docs
          cp "$GITHUB_WORKSPACE/ep2_build_docs/EP2_LINK_v0.2.0_BUILD_REPORT.md" /tmp/ep2-package-docs/
          cp "$GITHUB_WORKSPACE/ep2_build_docs/WORKLOG_2026-09-22_FIRMWARE_v0.2.0.md" /tmp/ep2-package-docs/
          zip -qr /tmp/EP2_LINK_v0.2.0_COMPILED_SOURCE.zip . -x '.pio/*'
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: EP2_LINK_v0.2.0
          path: |
            /tmp/ep2src/.pio/build/ep2_esp8285/EP2_LINK_v0.2.0_ESP8285.bin
            /tmp/ep2src/.pio/build/ep2_esp8285/EP2_LINK_v0.2.0_ESP8285.bin.gz
            /tmp/ep2src/.pio/build/ep2_esp8285/EP2_LINK_v0.2.0_MANIFEST.json
            /tmp/EP2_LINK_v0.2.0_COMPILED_SOURCE.zip
            /tmp/ep2-package-docs/EP2_LINK_v0.2.0_BUILD_REPORT.md
            /tmp/ep2-package-docs/WORKLOG_2026-09-22_FIRMWARE_v0.2.0.md
