name: RF Finder v0.6.2 bootstrap

on:
  push:
    branches:
      - rf-finder-v0.6.2
    paths:
      - '.github/workflows/rf-finder-v062-bootstrap.yml'
      - '.github/scripts/rf_finder_v062_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rf-finder-v0.6.2
          fetch-depth: 0

      - name: Normalize C++ newline anchors in patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/rf_finder_v062_patch.py')
          s=p.read_text(encoding='utf-8')
          targets=[
              r'I,diag,recoveries,%lu\n", diag.recoveries',
              r'I,diag,last_sweep_ms,%lu\n", diag.lastSweepDurationMs',
              r'I,range,%lu,%lu\n", MIN_FREQ_HZ, MAX_FREQ_HZ',
              r'A,F,%lu\n", fixedFreqHz',
          ]
          for t in targets:
              if t not in s:
                  raise SystemExit('missing patch anchor: '+t)
              s=s.replace(t,t.replace(r'\n',r'\\n'))
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply v0.6.2 source patch
        run: python .github/scripts/rf_finder_v062_patch.py

      - name: Validate Web UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('rf_finder/android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8
          b=s.index('</script>',a)
          Path('/tmp/rf_finder_ui.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/rf_finder_ui.js

      - name: RX-only invariant
        shell: bash
        run: |
          set -euo pipefail
          F=rf_finder/firmware/src/main.cpp
          if grep -E 'SET_TX|TX_DONE|SET_PA|OUTPUT_POWER|SET_TX_CW|startCW|CommitOutputPower' "$F"; then
            echo 'TX path token found in RF Finder firmware'
            exit 1
          fi
          grep -q 'WiFi.mode(WIFI_OFF)' "$F"

      - name: Commit source pair
        shell: bash
        run: |
          git config user.name fpvclub-build
          git config user.email 30724643+arcanalord@users.noreply.github.com
          git add rf_finder/firmware/src/main.cpp rf_finder/android/app/src/main/assets/index.html rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/MainActivity.java rf_finder/android/app/build.gradle
          git commit -m 'RF Finder v0.6.2-dev1: reliability, source lock and experimental range [skip ci]'
          git push origin HEAD:rf-finder-v0.6.2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        working-directory: rf_finder/firmware
        run: pio run -e rf_finder_lr1121_c3

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android
        working-directory: rf_finder/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp rf_finder/firmware/.pio/build/rf_finder_lr1121_c3/firmware.bin out/RF_Finder_DAKERFPV_LR1121_v0.6.2-dev1.bin
          cp rf_finder/android/app/build/outputs/apk/debug/app-debug.apk out/RF_Finder_Android_v0.6.2-dev1-debug.apk
          cd out
          sha256sum RF_Finder_DAKERFPV_LR1121_v0.6.2-dev1.bin RF_Finder_Android_v0.6.2-dev1-debug.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: RF-Finder-v0.6.2-dev1-pair
          path: out/*
