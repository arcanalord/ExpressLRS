name: Mesh Wi-Fi v1.6.2 LAN APK

on:
  push:
    branches:
      - feature/mesh-wifi-v1.6
    paths:
      - ".github/workflows/mesh-wifi-v1.6-apk.yml"
      - "mesh-messenger-ci/map-src/**"
      - "mesh-messenger-ci/v1.6.0/**"
      - "mesh-messenger-ci/prepare_current_source.py"
      - "mesh-messenger-ci/release_source_audit.py"
      - "mesh-messenger-ci/ui_startup_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-wifi-v1.6-apk
  cancel-in-progress: true

env:
  DROPBOX_FOLDER_URL: https://www.dropbox.com/scl/fo/ge8s6nkcgktgslxmpduil/AD361z8LQV-t5MZyimbpd2E?rlkey=zlcsukzyorqh9ggtfl36mhikg&st=1j9v34kw&dl=1
  VERSION_NAME: "1.6.2"
  VERSION_CODE: "28"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Restore validated v1.5.9 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _mesh160
          mkdir -p _mesh160/dropbox _mesh160/unpacked _mesh160/out
          curl -L --fail --retry 3 "$DROPBOX_FOLDER_URL" -o _mesh160/dropbox.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          outer=pathlib.Path("_mesh160/dropbox.zip")
          out=pathlib.Path("_mesh160/dropbox")
          with zipfile.ZipFile(outer) as z:
              for info in z.infolist():
                  raw=info.filename.replace("\\","/").lstrip("/")
                  parts=[p for p in raw.split("/") if p not in ("",".","..")]
                  if not parts: continue
                  p=out.joinpath(*parts)
                  if info.is_dir(): p.mkdir(parents=True,exist_ok=True)
                  else:
                      p.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as a,p.open("wb") as b: shutil.copyfileobj(a,b)
          PY
          BASE="$(find _mesh160/dropbox -type f -path '*/10_Релизы/SOURCE_CURRENT_v1.5.9.zip' -print -quit)"
          if [ -z "$BASE" ]; then BASE="$(find _mesh160/dropbox -type f -name 'SOURCE_CURRENT_v1.5.9.zip' -not -path '*/00_Baseline_v1.5.9/*' -print -quit)"; fi
          test -n "$BASE"
          sha256sum "$BASE" | tee _mesh160/BASE_SOURCE_SHA256.txt
          unzip -q "$BASE" -d _mesh160/unpacked
          ANDROID_DIR="$(find _mesh160/unpacked -type d -name android-app -print -quit)"
          test -n "$ANDROID_DIR"
          ROOT="$(dirname "$ANDROID_DIR")"
          test -f "$ROOT/src/app.js"
          test -f "$ROOT/index.html"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cp _mesh160/BASE_SOURCE_SHA256.txt _mesh160/out/BASE_SOURCE_SHA256.txt

      - name: Validate v1.5.9 map baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 mesh-messenger-ci/map-src/map_regression_test.py "$ROOT"
          grep -q "mapZoomInButton" "$ROOT/src/app.js"
          grep -q "locateMapButton" "$ROOT/index.html"

      - name: Apply Mesh Wi-Fi v1.6 transport layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/src/transports" "$ANDROID_DIR/app/src/main/assets/www/src/transports"
          cp mesh-messenger-ci/v1.6.0/transports/lan-peer-transport.js "$ROOT/src/transports/"
          cp mesh-messenger-ci/v1.6.0/transports/auto-route-selector.js "$ROOT/src/transports/"
          cp mesh-messenger-ci/v1.6.0/transports/lan-peer-transport.js "$ANDROID_DIR/app/src/main/assets/www/src/transports/"
          cp mesh-messenger-ci/v1.6.0/transports/auto-route-selector.js "$ANDROID_DIR/app/src/main/assets/www/src/transports/"
          python3 mesh-messenger-ci/v1.6.0/apply_wifi_v16.py "$ROOT"
          python3 mesh-messenger-ci/v1.6.0/apply_wifi_lan_ui_cleanup.py "$ROOT"
          grep -q "LanPeerTransport" "$ROOT/src/app.js"
          grep -q "AutoRouteSelector" "$ROOT/src/app.js"
          grep -q 'id="fastPairModal"' "$ROOT/index.html"
          grep -q 'id="fastPairModal"' "$ANDROID_DIR/app/src/main/assets/www/index.html"
          grep -q 'id="saveFastPeer"' "$ROOT/index.html"
          grep -q 'WIFI_ONLY_MODE = true' "$ROOT/src/app.js"
          ! grep -q '>QR-канал<' "$ROOT/index.html"
          ! grep -q '>Основной канал<' "$ROOT/index.html"
          ! grep -q '7 узлов' "$ROOT/index.html"
          ! grep -q "InternetRelayTransport" "$ROOT/src/app.js"
          ! grep -q "relayUrl" "$ROOT/index.html"
          ! grep -q "Internet-код" "$ROOT/index.html"

      - name: Set release identity and audit source
        shell: bash
        run: |
          set -euo pipefail
          python3 mesh-messenger-ci/prepare_current_source.py "$ROOT" "$VERSION_NAME" "$VERSION_CODE"
          node --check "$ROOT/src/app.js"
          node --check "$ROOT/src/transports/lan-peer-transport.js"
          node --check "$ROOT/src/transports/auto-route-selector.js"
          python3 mesh-messenger-ci/map-src/map_regression_test.py "$ROOT"
          python3 mesh-messenger-ci/release_source_audit.py "$ROOT"
          grep -Fq "versionName = \"$VERSION_NAME\"" "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq "versionCode = $VERSION_CODE" "$ANDROID_DIR/app/build.gradle.kts"

      - name: Install regression dependencies
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir opencv-python-headless playwright

      - name: Run deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          node tests/core.test.mjs
          node tests/help-registry.test.mjs
          node tests/meshtastic-stream.test.mjs
          node tests/phoneapi-lite.test.mjs
          node tests/phoneapi-snapshot.test.mjs
          node tests/share_import.test.mjs
          node tests/android_bridge_transport.test.mjs
          python3 tests/qr_assets.test.py
          bash tests/android_ble_contract.sh
          bash tests/android_ble_power_contract.sh
          bash tests/android_app_source_check.sh
          python3 tests/ui_compact_batch_a.test.py
          python3 tests/ui_compact_batch_b.test.py
          python3 "$GITHUB_WORKSPACE/mesh-messenger-ci/v1.6.0/lan_ui_startup_smoke.py" "."

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ANDROID_DIR" --no-daemon :app:assembleDebug

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee _mesh160/out/aapt-badging.txt
          grep -q "versionCode='$VERSION_CODE'" _mesh160/out/aapt-badging.txt
          grep -q "versionName='$VERSION_NAME'" _mesh160/out/aapt-badging.txt
          cp "$APK" "_mesh160/out/MeshWiFi-v$VERSION_NAME-debug.apk"
          sha256sum "_mesh160/out/MeshWiFi-v$VERSION_NAME-debug.apk" > _mesh160/out/APK_SHA256.txt
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["ROOT"])
          ver=os.environ["VERSION_NAME"]
          out=pathlib.Path("_mesh160/out") / ("SOURCE_CURRENT_v"+ver+".zip")
          skip=("/build/","/.gradle/","/.idea/")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      rel=p.relative_to(root).as_posix()
                      if any(x in "/"+rel for x in skip): continue
                      z.write(p,pathlib.Path("mesh-wifi-v"+ver)/rel)
          PY
          sha256sum "_mesh160/out/SOURCE_CURRENT_v$VERSION_NAME.zip" > _mesh160/out/SOURCE_SHA256.txt
          {
            echo "version=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "baseline=validated-v1.5.9-map"
            echo "transport_tests=PASS"
            echo "map_regression=PASS"
            echo "deterministic_regression=PASS"
            echo "android_build=PASS"
            echo "apk_verify=PASS"
            echo "lan_two_device=PENDING"
            echo "internet_relay=DEFERRED"
            echo "phone_runtime=PENDING"
          } > _mesh160/out/BUILD_RESULT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mesh-wifi-v1.6.2-lan-debug
          path: _mesh160/out/*
          retention-days: 30
