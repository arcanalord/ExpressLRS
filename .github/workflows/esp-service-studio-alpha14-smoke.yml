name: ESP Service Studio alpha.14 Android 15 Smoke

on:
  push:
    branches:
      - esp-service-studio-universal
    paths:
      - '.github/workflows/esp-service-studio-alpha14-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create alpha.14 Flutter shell
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.arcanalord --project-name service_studio /tmp/service_studio
          cp -a tools/esp-service-studio-universal/source_overlay/. /tmp/service_studio/
          rm -rf /tmp/service_studio/test
          mkdir -p /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio
          mkdir -p /tmp/service_studio/android/app/src/main/res/xml
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/MainActivity.kt /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/MainActivity.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/UsbSerialProbe.kt /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/UsbSerialProbe.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/OfficialElrsService.kt /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/OfficialElrsService.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/device_filter.xml /tmp/service_studio/android/app/src/main/res/xml/device_filter.xml
          cd /tmp/service_studio
          python3 android_overlay/patch_android.py
          flutter pub get

      - name: Build x86_64 smoke APK
        working-directory: /tmp/service_studio
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.14-x86_64-test.apk
          test -s /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.14-x86_64-test.apk
          sha256sum /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.14-x86_64-test.apk | tee /tmp/SMOKE_APK_SHA256.txt

      - name: Android 15 API 35 app-launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p /tmp/esp-emulator-evidence
            ADB="$ANDROID_HOME/platform-tools/adb"
            APK=/tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.14-x86_64-test.apk

            "$ADB" install -r "$APK"

            "$ADB" shell dumpsys package com.arcanalord.service_studio > /tmp/esp-emulator-evidence/package.txt
            grep -F "versionName=0.9.0-alpha.14" /tmp/esp-emulator-evidence/package.txt
            grep -F "versionCode=26092714" /tmp/esp-emulator-evidence/package.txt

            "$ADB" logcat -c
            "$ADB" shell am force-stop com.arcanalord.service_studio
            "$ADB" shell am start -W -n com.arcanalord.service_studio/.MainActivity | tee /tmp/esp-emulator-evidence/am-start.txt

            sleep 5
            "$ADB" shell pidof com.arcanalord.service_studio | tee /tmp/esp-emulator-evidence/pid.txt
            test -s /tmp/esp-emulator-evidence/pid.txt

            "$ADB" shell uiautomator dump /sdcard/esp_ui_1.xml >/dev/null
            "$ADB" pull /sdcard/esp_ui_1.xml /tmp/esp-emulator-evidence/ui_1.xml >/dev/null
            "$ADB" exec-out screencap -p > /tmp/esp-emulator-evidence/screen_1.png

            "$ADB" shell input swipe 500 1500 500 300 500 || true
            sleep 2
            "$ADB" shell uiautomator dump /sdcard/esp_ui_2.xml >/dev/null
            "$ADB" pull /sdcard/esp_ui_2.xml /tmp/esp-emulator-evidence/ui_2.xml >/dev/null
            "$ADB" exec-out screencap -p > /tmp/esp-emulator-evidence/screen_2.png

            cat /tmp/esp-emulator-evidence/ui_1.xml /tmp/esp-emulator-evidence/ui_2.xml > /tmp/esp-emulator-evidence/ui_all.xml
            grep -F "ESP Service Studio" /tmp/esp-emulator-evidence/ui_all.xml
            grep -F "ELRS оборудование" /tmp/esp-emulator-evidence/ui_all.xml

            "$ADB" logcat -d > /tmp/esp-emulator-evidence/logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\.arcanalord\.service_studio.*has died" /tmp/esp-emulator-evidence/logcat.txt; then
              echo "Application crash detected"
              exit 1
            fi

            cp /tmp/SMOKE_APK_SHA256.txt /tmp/esp-emulator-evidence/
            {
              echo "version=0.9.0-alpha.14"
              echo "api=35"
              echo "arch=x86_64"
              echo "install=PASS"
              echo "launch=PASS"
              echo "process_alive=PASS"
              echo "ui_identity=PASS"
              echo "crash_scan=PASS"
            } > /tmp/esp-emulator-evidence/SMOKE_RESULT.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Service-Studio-Universal-v0.9.0-alpha.14-api35-smoke
          path: /tmp/esp-emulator-evidence/
          if-no-files-found: warn
          retention-days: 30
