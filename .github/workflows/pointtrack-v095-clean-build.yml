name: PointTrack Android v0.9.5 clean

on:
  push:
    branches: [pointtrack-android-v0.9.5-clean]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Restore exact clean source
        shell: bash
        run: |
          set -euo pipefail
          echo "19d22cda0c0dbdd49a0dcf6233cc9f1dafdca72ea89370e6d29e59b775df7259  pointtrack_ci/source_v095.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pt"
          unzip -q pointtrack_ci/source_v095.zip -d "$RUNNER_TEMP/pt"
          test "$(cat "$RUNNER_TEMP/pt/VERSION")" = "0.9.5-dev"
          echo "PT=$RUNNER_TEMP/pt" >> "$GITHUB_ENV"
      - name: Core regression
        run: cd "$PT" && gradle --no-daemon :core:coreRegression --stacktrace
      - name: Build APK
        run: cd "$PT" && gradle --no-daemon :androidApp:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PT/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SRC" | grep "package: name='com.fpvclub.pointtrack'"
          mkdir -p out
          cp "$SRC" out/PointTrack_v0.9.5-dev-clean-debug.apk
          sha256sum out/PointTrack_v0.9.5-dev-clean-debug.apk | tee out/PointTrack_v0.9.5-dev-clean-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: PointTrack-v0.9.5-dev-clean-Android
          path: out/*
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='pointtrack-v0.9.5-dev-clean-android'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'PointTrack v0.9.5-dev clean Android' --notes 'Clean snapshot build. No patch layering. Temporal fast-path + bounded rescue. GYRO OFF.'
          fi
