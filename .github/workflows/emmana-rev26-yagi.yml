name: EMMana rev26 Yagi workflow gate

on:
  push:
    branches: [ emmana-next-alpha20 ]
    paths:
      - '.github/workflows/emmana-rev26-yagi.yml'
      - '.github/scripts/emmana_rev26_patch.py'
  workflow_dispatch:

jobs:
  rev26:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact rev25 source from Dropbox
        shell: pwsh
        run: |
          $url = 'https://www.dropbox.com/scl/fi/j8oha5gkjy12hifwln1j6/EMMana-Next-0.1.0-alpha.20-rev25-source-artifact.zip?rlkey=c47dijoj2drn2rr8lxrgoytxh&dl=1'
          Invoke-WebRequest -Uri $url -OutFile rev25.zip -TimeoutSec 120
          $sha = (Get-FileHash rev25.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'ebe1139e0e3f45f7eea72959070abddaff76b9ac3c2e973607b2d8f8bef866cc') { throw "rev25 source SHA mismatch: $sha" }
          Expand-Archive rev25.zip -DestinationPath src -Force
          $v = (Get-Content src/emmana_rev25/VERSION).Trim()
          if ($v -ne '0.1.0-alpha.20-rev25') { throw "Unexpected source VERSION: $v" }
          Write-Host "SOURCE_REV25_PASS sha=$sha"

      - name: Patch rev26 Yagi workflow
        shell: pwsh
        run: python .github/scripts/emmana_rev26_patch.py

      - name: Create rev26 source artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-artifact | Out-Null
          Copy-Item src/emmana_rev25 src-artifact/emmana_rev26 -Recurse
          Compress-Archive -Path src-artifact/emmana_rev26 -DestinationPath EMMana-Next-0.1.0-alpha.20-rev26-source-artifact.zip -Force

      - name: Install C++ dependencies
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-json:x64-windows-static eigen3:x64-windows-static

      - name: Configure and build
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          cmake -S . -B build-win -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DEMNEXT_REQUIRE_EIGEN=ON
          cmake --build build-win --config Release --parallel 2

      - name: Regression and rev26 Yagi gate
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          ctest --test-dir build-win -C Release --output-on-failure
          python tests/test_primary_actions.py .
          python tests/test_geometry_editor.py .
          python tests/test_ui_surface_state.py .
          python tests/test_help_registry.py .
          python tests/test_measurement_pipeline.py .
          python tests/test_product_workflow.py .
          python tests/test_windows_launcher.py .
          python tests/test_yagi_rev26.py --root . --emnext build-win/Release/emnext.exe

      - name: Build portable Windows launcher
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name EMMana-Next --hidden-import json --hidden-import hashlib --hidden-import importlib.util --hidden-import math --hidden-import subprocess --hidden-import tempfile --hidden-import urllib.parse --hidden-import http --hidden-import http.server --hidden-import cmath --hidden-import csv --hidden-import io --hidden-import re --hidden-import typing --add-binary "build-win/Release/emnext.exe;EMMana-Next" --add-data "apps;EMMana-Next/apps" --add-data "benchmarks;EMMana-Next/benchmarks" --add-data "schemas;EMMana-Next/schemas" --add-data "VERSION;EMMana-Next" apps/windows_launcher.py

      - name: Portable runtime rev26 UI gate
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          $port=8799
          $proc=Start-Process -FilePath "dist/EMMana-Next.exe" -ArgumentList "--no-browser","--port","$port" -PassThru -WindowStyle Hidden
          try {
            $health=$null
            for($i=0;$i -lt 60;$i++){Start-Sleep -Seconds 1;try{$health=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2;if($health.ok){break}}catch{}}
            if(-not $health -or $health.version -ne '0.1.0-alpha.20-rev26'){throw "Portable rev26 health/version failed"}
            $page=(Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 10).Content
            foreach($m in @('yagi-quick-panel','yagi-recalc','yagi-optimize','measurement-demo','geometry-3d-canvas')){if($page -notmatch [regex]::Escape($m)){throw "Missing packaged UI marker: $m"}}
            Write-Host "REV26_PORTABLE_UI_PASS"
          } finally {
            if($proc -and -not $proc.HasExited){Stop-Process -Id $proc.Id -Force}
          }

      - name: Package Windows rev26
        shell: pwsh
        working-directory: src/emmana_rev25
        run: |
          $version=(Get-Content VERSION).Trim()
          $pkg="dist/EMMana-Next-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/EMMana-Next.exe $pkg/EMMana-Next.exe
          Copy-Item build-win/Release/emnext.exe $pkg/emnext-cli.exe
          Copy-Item VERSION $pkg/
          @("EMMana-Next Portable Windows","","Запустите EMMana-Next.exe.","rev26: быстрый рабочий цикл Яги, понятные состояния оптимизации и измерений.","Расчёты выполняются локально на компьютере.") | Set-Content -Encoding UTF8 "$pkg/README-WINDOWS.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force

      - name: Upload rev26 source
        uses: actions/upload-artifact@v4
        with:
          name: emmana-rev26-source
          path: EMMana-Next-0.1.0-alpha.20-rev26-source-artifact.zip
          if-no-files-found: error

      - name: Upload rev26 Windows
        uses: actions/upload-artifact@v4
        with:
          name: emmana-rev26-windows-x64
          path: src/emmana_rev25/dist/EMMana-Next-0.1.0-alpha.20-rev26-windows-x64.zip
          if-no-files-found: error
