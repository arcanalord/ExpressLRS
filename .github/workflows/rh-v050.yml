name: Radio Horizon v0.5.0 SK42 APK
on:
  push:
    branches: ["ci-radio-horizon-apk-v030"]
    paths:
      - ".github/workflows/rh-v050.yml"
      - "tools/radio-horizon-ci/trigger-v050.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download canonical source from Dropbox
        run: |
          curl -L --fail --retry 3 'https://uc637d1f3197e76711e1814cd6a4.dl.dropboxusercontent.com/cd/0/get/DIfhfD2e6lOCVU72Ur190lt2yELy7OxktJRcELbk5njnWL9g1D8c5KIeJUjk1t0XEmXX2hSYyFJKVnlgL8Zu5iEsOJBxl_6GyjxQEIHnvu1-iaT_r__q0zNHWcTf0mtmJMI0wjbCww7yGrs_Rui22g1xw4lyJKMRxCsQ8OkMMowoBw/file?c_luid=cfbe8875' -o /tmp/rh-source.zip
          echo "a5e0a80d8613428c984c49ab46d5a4c2ecc39af0cc8a078d779732cff6bfc3e9  /tmp/rh-source.zip" | sha256sum -c -
          mkdir -p tools/radio-horizon-v050
          unzip -q /tmp/rh-source.zip -d tools/radio-horizon-v050
          mv tools/radio-horizon-v050/radio_horizon_v0.5.0 tools/radio-horizon
          cp /tmp/rh-source.zip tools/radio-horizon/Radio_Horizon_SOURCE_CURRENT_v0.5.0.zip

      - name: Vendor pinned MapLibre
        working-directory: tools/radio-horizon
        run: ./scripts/vendor-maplibre.sh

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run JS syntax and regression tests
        working-directory: tools/radio-horizon
        run: |
          node --check web/app.mjs
          npm test

      - name: Build APK
        working-directory: tools/radio-horizon/android
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK and provenance
        working-directory: tools/radio-horizon
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee APK_VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee APK_BADGING.txt
          sha256sum "$APK" | tee APK_SHA256.txt
          {
            echo "version=0.5.0"
            echo "source_sha256=a5e0a80d8613428c984c49ab46d5a4c2ecc39af0cc8a078d779732cff6bfc3e9"
            echo "git_ci_sha=$GITHUB_SHA"
            echo "runner_arch=$(uname -m)"
            java -version 2>&1 | head -1
            gradle --version | sed -n '1,8p'
          } | tee BUILD_PROVENANCE.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radio-horizon-v0.5.0-sk42
          path: |
            tools/radio-horizon/android/app/build/outputs/apk/debug/app-debug.apk
            tools/radio-horizon/Radio_Horizon_SOURCE_CURRENT_v0.5.0.zip
            tools/radio-horizon/APK_VERIFY.txt
            tools/radio-horizon/APK_BADGING.txt
            tools/radio-horizon/APK_SHA256.txt
            tools/radio-horizon/BUILD_PROVENANCE.txt
            tools/radio-horizon/docs/COORDINATE_SYSTEMS.md
            tools/radio-horizon/docs/QA_v0.5.0.md
          if-no-files-found: error
