name: RF Finder v0.6.2 Android hotfix

on:
  push:
    branches:
      - rf-finder-v0.6.2
    paths:
      - '.github/workflows/rf-finder-v062-android-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Patch Android source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rf_finder/android/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old="document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');requestAnimationFrame(()=>{drawHistory();drawSpectrum();drawWaterfall()})});"
          new="function enterView(name){if(name==='bearing'&&!elrsBearing){if(probeOn)stopElrs();if(scanOn)stopScan();send('F,'+Math.round(fixed*1e6));resetStats();ema=null}document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===name));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===name));requestAnimationFrame(()=>{drawHistory();drawSpectrum();drawWaterfall()})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>enterView(b.dataset.view));"
          if old not in s: raise SystemExit('tab handler pattern not found')
          s=s.replace(old,new,1)
          s=s.replace("document.querySelector('[data-view=\"bearing\"]').click();send('Q,TRACK,30000')","enterView('bearing');send('Q,TRACK,30000')",1)
          s=s.replace("document.querySelector('[data-view=\"bearing\"]').click()","enterView('bearing')",1)
          s=s.replace("FPV Club RF Finder v0.6.2-dev1 · RX-only · source-lock + timestamped bearing","FPV Club RF Finder v0.6.2-dev2 · RX-only · bearing mode recovery",1)
          s=s.replace("app:'0.6.2-dev1'","app:'0.6.2-dev2'",1)
          p.write_text(s,encoding='utf-8')

          p=Path('rf_finder/android/app/build.gradle')
          s=p.read_text(encoding='utf-8').replace('versionCode 10','versionCode 11',1).replace("versionName '0.6.2-dev1'","versionName '0.6.2-dev2'",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('rf_finder/android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/ui.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/ui.js
      - name: Commit source
        shell: bash
        run: |
          git config user.name fpvclub-build
          git config user.email 30724643+arcanalord@users.noreply.github.com
          git add rf_finder/android/app/src/main/assets/index.html rf_finder/android/app/build.gradle
          git commit -m 'RF Finder v0.6.2-dev2: recover fixed RSSI on bearing entry [skip ci]'
          git push origin HEAD:rf-finder-v0.6.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android
        working-directory: rf_finder/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          cp rf_finder/android/app/build/outputs/apk/debug/app-debug.apk out/RF_Finder_Android_v0.6.2-dev2-debug.apk
          cd out && sha256sum RF_Finder_Android_v0.6.2-dev2-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: RF-Finder-Android-v0.6.2-dev2-hotfix
          path: out/*
