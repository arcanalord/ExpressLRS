name: Mesh Messenger v1.5.9 Offline Maps
# rerun: clean-source-audit-v2

on:
  push:
    branches: [feature/mesh-main-offline-maps-v1.5.9]
    paths:
      - ".github/workflows/mesh-messenger-v1.5.9-map-interaction.yml"
      - "mesh-messenger-ci/map-src/**"
      - "mesh-messenger-ci/prepare_current_source.py"
      - "mesh-messenger-ci/release_source_audit.py"
      - "mesh-messenger-ci/ui_startup_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-messenger-v1.5.9-offline-maps
  cancel-in-progress: true

env:
  SOURCE_SHA256: 4047f60859dbc5ad37d4708ebf9e826d3ed5be6226c5c1d66ca2c03a25a5aa87
  BASE_RUN_ID: "35638627323"
  BASE_ARTIFACT: mesh-messenger-v1.5.9-map-interaction
  VERSION_NAME: "1.5.9"
  VERSION_CODE: "25"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mesh-main-offline-maps-v1.5.9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Restore exact validated v1.5.9 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _mesh159
          mkdir -p _mesh159/base_artifact _mesh159/unpacked _mesh159/out
          gh run download "$BASE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$BASE_ARTIFACT" -D _mesh159/base_artifact
          BASE="_mesh159/base_artifact/SOURCE_CURRENT_v${VERSION_NAME}.zip"
          test -s "$BASE"
          echo "$SOURCE_SHA256  $BASE" | sha256sum -c -
          unzip -q "$BASE" -d _mesh159/unpacked
          ANDROID_DIR="$(find _mesh159/unpacked -type d -name android-app -print -quit)"
          test -n "$ANDROID_DIR"
          ROOT="$(dirname "$ANDROID_DIR")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Vendor vector map runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _mesh_vendor
          mkdir -p _mesh_vendor/node_modules
          cd _mesh_vendor
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund maplibre-gl@6.10.0 pmtiles@4.5.0
          test -f node_modules/maplibre-gl/dist/maplibre-gl.mjs
          test -f node_modules/maplibre-gl/dist/maplibre-gl.css
          test -f node_modules/pmtiles/dist/pmtiles.js
          cd "$GITHUB_WORKSPACE"

      - name: Apply current map + location work
        shell: bash
        run: |
          set -euo pipefail
          cp mesh-messenger-ci/map-src/index.html "$ROOT/index.html"
          cp mesh-messenger-ci/map-src/app.js "$ROOT/src/app.js"
          cp mesh-messenger-ci/map-src/offline-map-manager.js "$ROOT/src/offline-map-manager.js"
          cp mesh-messenger-ci/map-src/vector-package-manager.js "$ROOT/src/vector-package-manager.js"
          cp mesh-messenger-ci/map-src/vector-map-adapter.js "$ROOT/src/vector-map-adapter.js"
          cp mesh-messenger-ci/map-src/openmaptiles-basic-style.js "$ROOT/src/openmaptiles-basic-style.js"
          cp mesh-messenger-ci/map-src/vector-runtime-bootstrap.js "$ROOT/src/vector-runtime-bootstrap.js"
          mkdir -p "$ROOT/vendor"
          cp _mesh_vendor/node_modules/maplibre-gl/dist/maplibre-gl.mjs "$ROOT/vendor/maplibre-gl.mjs"
          cp _mesh_vendor/node_modules/maplibre-gl/dist/maplibre-gl.css "$ROOT/vendor/maplibre-gl.css"
          cp _mesh_vendor/node_modules/pmtiles/dist/pmtiles.js "$ROOT/vendor/pmtiles.js"
          cp mesh-messenger-ci/map-src/styles.css "$ROOT/src/styles.css"
          cp mesh-messenger-ci/map-src/AndroidManifest.xml "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          cp mesh-messenger-ci/map-src/android-index.html "$ANDROID_DIR/app/src/main/assets/www/index.html"
          cp mesh-messenger-ci/map-src/android-app.js "$ANDROID_DIR/app/src/main/assets/www/src/app.js"
          cp mesh-messenger-ci/map-src/offline-map-manager.js "$ANDROID_DIR/app/src/main/assets/www/src/offline-map-manager.js"
          cp mesh-messenger-ci/map-src/vector-package-manager.js "$ANDROID_DIR/app/src/main/assets/www/src/vector-package-manager.js"
          cp mesh-messenger-ci/map-src/vector-map-adapter.js "$ANDROID_DIR/app/src/main/assets/www/src/vector-map-adapter.js"
          cp mesh-messenger-ci/map-src/openmaptiles-basic-style.js "$ANDROID_DIR/app/src/main/assets/www/src/openmaptiles-basic-style.js"
          cp mesh-messenger-ci/map-src/vector-runtime-bootstrap.js "$ANDROID_DIR/app/src/main/assets/www/src/vector-runtime-bootstrap.js"
          mkdir -p "$ANDROID_DIR/app/src/main/assets/www/vendor"
          cp _mesh_vendor/node_modules/maplibre-gl/dist/maplibre-gl.mjs "$ANDROID_DIR/app/src/main/assets/www/vendor/maplibre-gl.mjs"
          cp _mesh_vendor/node_modules/maplibre-gl/dist/maplibre-gl.css "$ANDROID_DIR/app/src/main/assets/www/vendor/maplibre-gl.css"
          cp _mesh_vendor/node_modules/pmtiles/dist/pmtiles.js "$ANDROID_DIR/app/src/main/assets/www/vendor/pmtiles.js"
          cp mesh-messenger-ci/map-src/android-styles.css "$ANDROID_DIR/app/src/main/assets/www/src/styles.css"
          MAIN_FILE="$ANDROID_DIR/app/src/main/kotlin/org/fpvclub/mesh/app/MainActivity.kt"
          python3 - "$MAIN_FILE" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding="utf-8")
          if "geolocationPermissionRequest=1404" not in s:
              s=s.replace("    private val bluetoothEnableRequest=1403\n",
              "    private val bluetoothEnableRequest=1403\n    private val geolocationPermissionRequest=1404\n    private var pendingGeolocationOrigin:String?=null\n    private var pendingGeolocationCallback:GeolocationPermissions.Callback?=null\n")
          s=s.replace(
              "        webView.settings.javaScriptEnabled=true;webView.settings.domStorageEnabled=true;webView.settings.mediaPlaybackRequiresUserGesture=false\n",
              "        webView.settings.javaScriptEnabled=true;webView.settings.domStorageEnabled=true;webView.settings.mediaPlaybackRequiresUserGesture=false;webView.settings.setGeolocationEnabled(true)\n"
          )
          if "onGeolocationPermissionsShowPrompt" not in s:
              marker="        webView.webViewClient=object:WebViewClientCompat(){"
              chrome='''        webView.webChromeClient=object:WebChromeClient(){\n            override fun onGeolocationPermissionsShowPrompt(origin:String,callback:GeolocationPermissions.Callback){\n                val granted=checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)==PackageManager.PERMISSION_GRANTED\n                if(granted){callback.invoke(origin,true,false);return}\n                pendingGeolocationOrigin=origin;pendingGeolocationCallback=callback\n                requestPermissions(arrayOf(Manifest.permission.ACCESS_COARSE_LOCATION,Manifest.permission.ACCESS_FINE_LOCATION),geolocationPermissionRequest)\n            }\n        }\n'''
              s=s.replace(marker,chrome+marker)
          if "if(requestCode==geolocationPermissionRequest)" not in s:
              anchor='''        if(requestCode==permissionRequest){\n            val denied=permissions.indices.filter{grantResults.getOrNull(it)!=PackageManager.PERMISSION_GRANTED}.map{permissions[it]}\n            if(hasBleRuntimePermissions())maybeStartMeshService()\n            val cont=permissionContinuation;permissionContinuation=null;cont?.invoke(denied.isEmpty(),denied)\n        }\n'''
              geo='''        if(requestCode==geolocationPermissionRequest){\n            val granted=checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)==PackageManager.PERMISSION_GRANTED\n            val origin=pendingGeolocationOrigin;val callback=pendingGeolocationCallback\n            pendingGeolocationOrigin=null;pendingGeolocationCallback=null\n            if(origin!=null&&callback!=null)callback.invoke(origin,granted,false)\n        }\n'''
              s=s.replace(anchor,anchor+geo)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Clean source owners and release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 mesh-messenger-ci/prepare_current_source.py "$ROOT" "$VERSION_NAME" "$VERSION_CODE"
          node --check "$ROOT/src/app.js"
          node --check "$ROOT/src/offline-map-manager.js"
          node --check "$ROOT/src/vector-package-manager.js"
          node --check "$ROOT/src/vector-map-adapter.js"
          node --check "$ROOT/src/openmaptiles-basic-style.js"
          node --check "$ROOT/src/vector-runtime-bootstrap.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/app.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/offline-map-manager.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/vector-package-manager.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/vector-map-adapter.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/openmaptiles-basic-style.js"
          node --check "$ANDROID_DIR/app/src/main/assets/www/src/vector-runtime-bootstrap.js"
          node --check "$ROOT/src/core.js"
          python3 mesh-messenger-ci/map-src/map_regression_test.py "$ROOT"
          python3 mesh-messenger-ci/offline_map_regression_test.py "$ROOT"
          python3 mesh-messenger-ci/release_source_audit.py "$ROOT"
          grep -q "onGeolocationPermissionsShowPrompt" "$ANDROID_DIR/app/src/main/kotlin/org/fpvclub/mesh/app/MainActivity.kt"
          grep -Fq "versionName = \"$VERSION_NAME\"" "$ANDROID_DIR/app/build.gradle.kts"
          grep -Fq "versionCode = $VERSION_CODE" "$ANDROID_DIR/app/build.gradle.kts"
      - name: Install regression test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir opencv-python-headless playwright

      - name: Run deterministic regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          node tests/core.test.mjs
          node tests/help-registry.test.mjs
          node tests/meshtastic-stream.test.mjs
          node tests/phoneapi-lite.test.mjs
          node tests/phoneapi-snapshot.test.mjs
          node tests/share_import.test.mjs
          node tests/android_bridge_transport.test.mjs
          python3 tests/qr_assets.test.py
          bash tests/android_ble_contract.sh
          bash tests/android_ble_power_contract.sh
          bash tests/android_app_source_check.sh
          python3 tests/ui_compact_batch_a.test.py
          python3 tests/ui_compact_batch_b.test.py
          python3 "$GITHUB_WORKSPACE/mesh-messenger-ci/ui_startup_smoke.py" "."
      - name: Build Android
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ANDROID_DIR" --no-daemon :app:assembleDebug
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee _mesh159/out/aapt-badging.txt
          grep -q "versionCode='$VERSION_CODE'" _mesh159/out/aapt-badging.txt
          grep -q "versionName='$VERSION_NAME'" _mesh159/out/aapt-badging.txt
          cp "$APK" "_mesh159/out/MeshMessenger-v${VERSION_NAME}-map-debug.apk"
          sha256sum "_mesh159/out/MeshMessenger-v${VERSION_NAME}-map-debug.apk" > _mesh159/out/APK_SHA256.txt
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["ROOT"])
          ver=os.environ["VERSION_NAME"]
          out=pathlib.Path(f"_mesh159/out/SOURCE_CURRENT_v{ver}.zip")
          skip=("/build/","/.gradle/","/.idea/")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      rel=p.relative_to(root).as_posix()
                      if any(x in "/"+rel for x in skip): continue
                      z.write(p,pathlib.Path(f"mesh-messenger-v{ver}-work")/rel)
          PY
          sha256sum "_mesh159/out/SOURCE_CURRENT_v${VERSION_NAME}.zip" > _mesh159/out/SOURCE_SHA256.txt

          PC_DIR="_mesh159/pc/MeshMessenger-PC-v${VERSION_NAME}-vector-offline"
          rm -rf "_mesh159/pc"
          mkdir -p "$PC_DIR"
          cp "$ROOT/index.html" "$PC_DIR/index.html"
          cp "$ROOT/manifest.webmanifest" "$PC_DIR/manifest.webmanifest"
          cp "$ROOT/sw.js" "$PC_DIR/sw.js"
          cp -a "$ROOT/src" "$PC_DIR/src"
          cp -a "$ROOT/vendor" "$PC_DIR/vendor"
          cat > "$PC_DIR/start-windows.bat" <<'BAT'
@echo off
setlocal
cd /d "%~dp0"
powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0start-windows.ps1"
BAT
          cat > "$PC_DIR/start-windows.ps1" <<'POWERSHELL'
$ErrorActionPreference = 'Stop'
Set-Location $PSScriptRoot
$required = @(
  'vendor\maplibre-gl.mjs',
  'vendor\maplibre-gl.css',
  'vendor\pmtiles.js'
)
foreach ($file in $required) {
  if (-not (Test-Path $file) -or (Get-Item $file).Length -eq 0) {
    throw "Отсутствует встроенная библиотека: $file"
  }
}
$port = 4173
$url = "http://127.0.0.1:$port/"
$py = Get-Command py -ErrorAction SilentlyContinue
$python = Get-Command python -ErrorAction SilentlyContinue
if ($py) {
  Start-Process $url
  & py -3 -m http.server $port --bind 127.0.0.1
  exit $LASTEXITCODE
}
if ($python) {
  Start-Process $url
  & python -m http.server $port --bind 127.0.0.1
  exit $LASTEXITCODE
}
$listener = New-Object System.Net.HttpListener
$listener.Prefixes.Add($url)
$listener.Start()
Start-Process $url
$mime = @{
  '.html'='text/html; charset=utf-8'
  '.js'='text/javascript; charset=utf-8'
  '.mjs'='text/javascript; charset=utf-8'
  '.css'='text/css; charset=utf-8'
  '.json'='application/json; charset=utf-8'
  '.webmanifest'='application/manifest+json; charset=utf-8'
  '.png'='image/png'
  '.svg'='image/svg+xml'
  '.pmtiles'='application/vnd.pmtiles'
}
try {
  while ($listener.IsListening) {
    $ctx = $listener.GetContext()
    $rel = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
    if ([string]::IsNullOrWhiteSpace($rel)) { $rel = 'index.html' }
    $root = [IO.Path]::GetFullPath($PSScriptRoot)
    $full = [IO.Path]::GetFullPath((Join-Path $root $rel))
    if (-not $full.StartsWith($root) -or -not (Test-Path $full -PathType Leaf)) {
      $ctx.Response.StatusCode = 404
      $ctx.Response.Close()
      continue
    }
    $ext = [IO.Path]::GetExtension($full).ToLowerInvariant()
    if ($mime.ContainsKey($ext)) { $ctx.Response.ContentType = $mime[$ext] }
    $bytes = [IO.File]::ReadAllBytes($full)
    $ctx.Response.ContentLength64 = $bytes.Length
    $ctx.Response.OutputStream.Write($bytes,0,$bytes.Length)
    $ctx.Response.Close()
  }
} finally {
  if ($listener.IsListening) { $listener.Stop() }
  $listener.Close()
}
POWERSHELL
          cat > "$PC_DIR/README_PC.txt" <<EOF
Mesh Messenger PC — vector-first offline candidate
Baseline: v${VERSION_NAME}
Map stack: PMTiles + MapLibre, raster fallback retained.

Полностью автономный runtime:
- MapLibre GL JS 6.10.0 встроен в vendor/
- PMTiles JS 4.5.0 встроен в vendor/
- при запуске библиотеки из интернета не скачиваются

Windows:
1. Распакуйте ZIP.
2. Запустите start-windows.bat.
3. Настройки -> Офлайн-карты -> Импорт .pmtiles.
EOF
          test -s "$PC_DIR/vendor/maplibre-gl.mjs"
          test -s "$PC_DIR/vendor/maplibre-gl.css"
          test -s "$PC_DIR/vendor/pmtiles.js"
          ! grep -R -E "unpkg\.com|cdn\.jsdelivr\.net" "$PC_DIR" --exclude='README_PC.txt'
          python3 - "$PC_DIR" "_mesh159/out/MeshMessenger-PC-v${VERSION_NAME}-vector-offline.zip" <<'PY'
          import pathlib,sys,zipfile
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in src.rglob("*"):
                  if p.is_file(): z.write(p,src.name+"/"+p.relative_to(src).as_posix())
          PY
          sha256sum "_mesh159/out/MeshMessenger-PC-v${VERSION_NAME}-vector-offline.zip" > _mesh159/out/PC_ZIP_SHA256.txt
          {
            echo "version=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "base_source_sha256=$SOURCE_SHA256"
            echo "source_audit=PASS"
            echo "map_regression=PASS"
            echo "map_architecture=VECTOR_FIRST_PMTILES_MAPLIBRE"
            echo "maplibre_version=6.10.0"
            echo "pmtiles_version=4.5.0"
            echo "pc_vendor_runtime=OFFLINE_EMBEDDED"
            echo "raster_fallback=ENABLED"
            echo "deterministic_regression=PASS"
            echo "android_build=PASS"
            echo "apk_verify=PASS"
            echo "phone_runtime=PENDING"
            echo "hardware_e2e=PENDING"
          } > _mesh159/out/BUILD_RESULT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-messenger-v1.5.9-offline-maps
          path: _mesh159/out/*
          retention-days: 30
