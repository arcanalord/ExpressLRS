name: Mesh Messenger v1.5.1 APK

on:
  push:
    branches:
      - ci/mesh-messenger-v1.5.1-apk
    paths:
      - ".github/workflows/mesh-messenger-v1.5.1-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-messenger-v1.5.1-apk
  cancel-in-progress: true

env:
  SOURCE_SHA256: 1aeae2eec49b264a21004990e6827cd68d6ad00ae09d9065f95cab8d2809e054
  DROPBOX_FOLDER_URL: https://www.dropbox.com/scl/fo/ge8s6nkcgktgslxmpduil/AD361z8LQV-t5MZyimbpd2E?rlkey=zlcsukzyorqh9ggtfl36mhikg&st=1j9v34kw&dl=1
  GRADLE_VERSION: "8.13"
  BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download exact v1.5 source from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _mesh_source/dropbox
          curl -L --fail --retry 3 --retry-delay 2 "$DROPBOX_FOLDER_URL" -o _mesh_source/dropbox-folder.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          archive = pathlib.Path("_mesh_source/dropbox-folder.zip")
          out = pathlib.Path("_mesh_source/dropbox")
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  raw = info.filename.replace("\\", "/").lstrip("/")
                  parts = [p for p in raw.split("/") if p not in ("", ".", "..")]
                  if not parts:
                      continue
                  target = out.joinpath(*parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
          PY

          SOURCE_ZIP="$(find _mesh_source/dropbox -type f -name 'SOURCE_CURRENT_v1.5.zip' -print -quit)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "SOURCE_CURRENT_v1.5.zip was not found in Dropbox export" >&2
            find _mesh_source/dropbox -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c -
          cp "$SOURCE_ZIP" _mesh_source/SOURCE_CURRENT_v1.5.zip
          unzip -q _mesh_source/SOURCE_CURRENT_v1.5.zip -d _mesh_source/unpacked

          ANDROID_DIR="$(find _mesh_source/unpacked -type d -name android-app -print -quit)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "android-app directory was not found in source archive" >&2
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify v1.5 baseline and apply v1.5.1 build patch
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$ANDROID_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 16' "$BUILD_FILE"
          grep -q 'versionName = "1.5"' "$BUILD_FILE"
          grep -q 'applicationId = "org.fpvclub.mesh"' "$BUILD_FILE"
          grep -q 'kotlinOptions { jvmTarget = "17" }' "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '    kotlinOptions { jvmTarget = "17" }\n'
          if old not in s:
              raise SystemExit("expected v1.5 kotlinOptions line not found")
          s = s.replace(old, '')
          needle = '}\n\ndependencies {'
          repl = '''}\n\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")\n    }\n}\n\ndependencies {'''
          if needle not in s:
              raise SystemExit("dependencies boundary not found")
          s = s.replace(needle, repl, 1)
          s = s.replace('versionCode = 16', 'versionCode = 17')
          s = s.replace('versionName = "1.5"', 'versionName = "1.5.1"')
          p.write_text(s)
          PY

          grep -q 'versionCode = 17' "$BUILD_FILE"
          grep -q 'versionName = "1.5.1"' "$BUILD_FILE"
          grep -q 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")' "$BUILD_FILE"
          java -version
          gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$ANDROID_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          zipalign -c -v 4 "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee _mesh_source/aapt-badging.txt

          grep -q "package: name='org.fpvclub.mesh'" _mesh_source/aapt-badging.txt
          grep -q "versionCode='17'" _mesh_source/aapt-badging.txt
          grep -q "versionName='1.5.1'" _mesh_source/aapt-badging.txt

          sha256sum "$APK" | tee _mesh_source/APK_SHA256.txt
          cp "$APK" _mesh_source/MeshMessenger-v1.5.1-debug.apk

      - name: Write build provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Mesh Messenger v1.5.1 GitHub Actions build"
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "source_sha256=$SOURCE_SHA256"
            echo "gradle=$GRADLE_VERSION"
            echo "build_tools=$BUILD_TOOLS_VERSION"
            echo "application_id=org.fpvclub.mesh"
            echo "version_name=1.5.1"
            echo "version_code=17"
            echo
            java -version 2>&1
            echo
            gradle --version
          } > _mesh_source/BUILD_PROVENANCE.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesh-messenger-v1.5-debug-apk
          path: |
            _mesh_source/MeshMessenger-v1.5.1-debug.apk
            _mesh_source/APK_SHA256.txt
            _mesh_source/aapt-badging.txt
            _mesh_source/BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
