name: Radio Horizon 1.0.0-rc1 APK
on:
  push:
    branches: ["ci-radio-horizon-apk-v030"]
    paths:
      - ".github/workflows/rh-v100-rc1.yml"
      - "tools/radio-horizon-ci/trigger-v100-rc1.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact canonical source from Dropbox
        run: |
          curl -L --fail --retry 3 'https://ucb1fd0ca5996836184cfc61279a.dl.dropboxusercontent.com/cd/0/get/DIeFO0onXq0AqkKucGZuPzHdowpJegljADWZE-RyYhHTuvDpgQW6r9t2KMKCybiD8-MzzCirhq3JN30e6jpokFo1Muq9caD0V8yXRJFJZVAl2Sevz7XmF7KdjveJM9-GcP6lZXNudCqkgTF8uL79LfXu1Bc-pAYo7dces2ZYOvj6Dw/file?c_luid=cfbe8875' -o /tmp/rh-source.zip
          echo "547b6e1c5898c37c53bc5b9751528bba76e0a6ca113b1afd3e775c6fa44f8418  /tmp/rh-source.zip" | sha256sum -c -
          rm -rf tools/radio-horizon tools/radio-horizon-rc1
          mkdir -p tools/radio-horizon-rc1
          unzip -q /tmp/rh-source.zip -d tools/radio-horizon-rc1
          mv tools/radio-horizon-rc1/radio_horizon_v1.0.0-rc1 tools/radio-horizon
          cp /tmp/rh-source.zip tools/radio-horizon/Radio_Horizon_SOURCE_CURRENT_v1.0.0-rc1.zip

      - name: Vendor pinned MapLibre
        working-directory: tools/radio-horizon
        run: ./scripts/vendor-maplibre.sh

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run release regression tests
        working-directory: tools/radio-horizon
        run: |
          node --check web/app.mjs
          node --check adapters/dem.mjs
          npm test
          cmp web/index.html android/app/src/main/assets/app/web/index.html
          cmp web/app.mjs android/app/src/main/assets/app/web/app.mjs
          cmp web/styles.css android/app/src/main/assets/app/web/styles.css
          cmp adapters/dem.mjs android/app/src/main/assets/app/adapters/dem.mjs

      - name: Build APK
        working-directory: tools/radio-horizon/android
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK and provenance
        working-directory: tools/radio-horizon
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee APK_VERIFY.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee APK_BADGING.txt
          sha256sum "$APK" | tee APK_SHA256.txt
          {
            echo "version=1.0.0-rc1"
            echo "source_sha256=547b6e1c5898c37c53bc5b9751528bba76e0a6ca113b1afd3e775c6fa44f8418"
            echo "git_ci_sha=$GITHUB_SHA"
            echo "runner_arch=$(uname -m)"
            java -version 2>&1 | head -1
            gradle --version | sed -n '1,8p'
          } | tee BUILD_PROVENANCE.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radio-horizon-v1.0.0-rc1
          path: |
            tools/radio-horizon/android/app/build/outputs/apk/debug/app-debug.apk
            tools/radio-horizon/Radio_Horizon_SOURCE_CURRENT_v1.0.0-rc1.zip
            tools/radio-horizon/APK_VERIFY.txt
            tools/radio-horizon/APK_BADGING.txt
            tools/radio-horizon/APK_SHA256.txt
            tools/radio-horizon/BUILD_PROVENANCE.txt
            tools/radio-horizon/docs/QA_v1.0.0-rc1.md
            tools/radio-horizon/docs/RELEASE_NOTES_v1.0.0-rc1.md
          if-no-files-found: error
