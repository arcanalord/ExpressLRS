name: Mesh Messenger dev.11 visual QA video

on:
  workflow_dispatch:
  push:
    branches:
      - build/mesh-flutter-v0.1.10-dev.11
    paths:
      - '.github/workflows/mesh-flutter-dev11-video.yml'

concurrency:
  group: mesh-flutter-dev11-video
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct current dev.11 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mesh-video
          base64 -d .ci/mesh-v0110/source_v0110_dev3.zip.b64 > /tmp/mesh-video/source.zip
          echo '38a92c9c3873239c7db9c472800e4229d60a8a539bbb964b057e03029eebcda4  /tmp/mesh-video/source.zip' | sha256sum -c -
          unzip -q /tmp/mesh-video/source.zip -d /tmp/mesh-video/unpacked
          ROOT="$(find /tmp/mesh-video/unpacked -maxdepth 1 -mindepth 1 -type d -name 'mesh_messenger_flutter_*' -print -quit)"
          test -n "$ROOT"
          APP_DIR="$ROOT/flutter_app"
          cp -a .ci/mesh-v0110/dev5-overlay/. "$APP_DIR/"
          sed -i 's/^version: .*/version: 0.1.10-dev.11+26092504/' "$APP_DIR/pubspec.yaml"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xdotool wmctrl openbox libgtk-3-dev ninja-build pkg-config

      - name: Prepare source
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          python3 tool/fetch_map_vendor.py
          python3 tool/map_vendor_gate.py
          flutter create --platforms=linux --project-name mesh_messenger_flutter .

      - name: Two-node MM-UART integration test
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -o pipefail
          dart run tool/mm_uart_two_node_self_test.dart | tee /tmp/MM_UART_TWO_NODE_TEST.txt

      - name: Build Linux UI
        working-directory: ${{ env.APP_DIR }}
        run: flutter build linux --debug

      - name: Record real Flutter UI
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 720x1280x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          openbox >/tmp/openbox.log 2>&1 &
          OPENBOX_PID=$!
          sleep 1

          BIN="build/linux/x64/debug/bundle/mesh_messenger_flutter"
          test -x "$BIN"
          "$BIN" >/tmp/mesh-ui.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 40); do
            WIN="$(xdotool search --name 'Mesh Messenger' 2>/dev/null | head -n1 || true)"
            [ -n "$WIN" ] && break
            sleep 0.5
          done
          test -n "${WIN:-}"

          xdotool windowactivate "$WIN" || true
          xdotool windowmove "$WIN" 90 120 || true
          xdotool windowsize "$WIN" 540 960 || true
          sleep 3

          ffmpeg -y -f x11grab -framerate 24 -video_size 720x1280 -i :99.0             -c:v libx264 -preset veryfast -pix_fmt yuv420p /tmp/MeshMessenger-dev11-visual-QA.mp4             >/tmp/ffmpeg.log 2>&1 &
          FFMPEG_PID=$!

          sleep 4
          # Map
          xdotool mousemove 292 1040 click 1 || true
          sleep 5
          # Connection
          xdotool mousemove 428 1040 click 1 || true
          sleep 7
          # Help
          xdotool mousemove 548 155 click 1 || true
          sleep 6
          xdotool key Escape || true
          sleep 2
          # Settings
          xdotool mousemove 563 1040 click 1 || true
          sleep 4

          kill -INT "$FFMPEG_PID" || true
          wait "$FFMPEG_PID" || true
          kill "$APP_PID" || true
          kill "$OPENBOX_PID" || true
          kill "$XVFB_PID" || true

          test -s /tmp/MeshMessenger-dev11-visual-QA.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/MeshMessenger-dev11-visual-QA.mp4             | tee /tmp/VIDEO_INFO.txt
          cp /tmp/mesh-ui.log /tmp/MESH_UI_LOG.txt

      - name: QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "Mesh Messenger Flutter v0.1.10-dev.11 visual QA"
            echo
            echo "Automated two-node MM-UART:"
            cat /tmp/MM_UART_TWO_NODE_TEST.txt
            echo
            echo "Video:"
            cat /tmp/VIDEO_INFO.txt
            echo
            echo "Linux UI process log:"
            tail -n 100 /tmp/MESH_UI_LOG.txt
          } > /tmp/QA_VIDEO_REPORT.txt

      - name: Upload video QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeshMessenger-dev11-visual-QA
          path: |
            /tmp/MeshMessenger-dev11-visual-QA.mp4
            /tmp/MM_UART_TWO_NODE_TEST.txt
            /tmp/QA_VIDEO_REPORT.txt
            /tmp/MESH_UI_LOG.txt
          if-no-files-found: error
          retention-days: 14
