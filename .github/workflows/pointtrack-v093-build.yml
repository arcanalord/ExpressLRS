name: PointTrack Android v0.9.3

on:
  push:
    branches:
      - pointtrack-android-v0.9.3-dev
    paths:
      - 'pointtrack_ci/source_v093.b64.*'
      - '.github/workflows/pointtrack-v093-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: PointTrack v0.9.3 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore and verify PointTrack v0.9.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat pointtrack_ci/source_v093.b64.* | base64 -d > "$RUNNER_TEMP/PointTrack_v0.9.3-dev_android_source.zip"
          echo "c3974ce12723a79086a6c67aa97861362f49c189574a0024a3e40476e3321474  $RUNNER_TEMP/PointTrack_v0.9.3-dev_android_source.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/PointTrack_v0.9.3-dev_android_source.zip"
          mkdir -p "$RUNNER_TEMP/pointtrack"
          unzip -q "$RUNNER_TEMP/PointTrack_v0.9.3-dev_android_source.zip" -d "$RUNNER_TEMP/pointtrack"
          test -f "$RUNNER_TEMP/pointtrack/settings.gradle.kts"
          test "$(cat "$RUNNER_TEMP/pointtrack/VERSION")" = "0.9.3-dev"
          echo "PT=$RUNNER_TEMP/pointtrack" >> "$GITHUB_ENV"

      - name: Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$PT"
          gradle --no-daemon :core:coreRegression --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PT"
          gradle --no-daemon :androidApp:assembleDebug --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PT/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SRC" | grep "package: name='com.fpvclub.pointtrack'"
          mkdir -p out/android
          cp "$SRC" out/android/PointTrack_v0.9.3-dev-debug.apk
          sha256sum out/android/PointTrack_v0.9.3-dev-debug.apk | tee out/android/PointTrack_v0.9.3-dev-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: PointTrack-v0.9.3-dev-Android
          path: out/android/*
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='pointtrack-v0.9.3-dev-android'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/android/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/android/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'PointTrack v0.9.3-dev Android' \
              --notes 'Tracking retention increment: ROI-native detector, visual camera-motion translation, Kalman/IMM prediction, bounded multi-hypothesis association, appearance-aware scoring, adaptive target radius/gate visualization, active-target hot-pixel guard and acquisition static-clutter veto.'
          fi
