name: Chat Lite Android APK

on:
  push:
    branches:
      - chatgpt-lite-android
    paths:
      - 'tools/chatgpt-lite-android/**'
      - '.github/workflows/chatgpt-lite-android.yml'
  pull_request:
    paths:
      - 'tools/chatgpt-lite-android/**'
      - '.github/workflows/chatgpt-lite-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'platform-tools'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        working-directory: tools/chatgpt-lite-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp tools/chatgpt-lite-android/app/build/outputs/apk/debug/app-debug.apk artifacts/ChatLite-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatLite-debug-apk
          path: artifacts/ChatLite-debug.apk
          if-no-files-found: error
          retention-days: 14
