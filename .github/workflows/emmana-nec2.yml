name: EMMana real NEC2 validation

on:
  workflow_dispatch:
  push:
    branches: [ emmana-next-alpha20 ]
    paths:
      - 'EMMana-Next/**'
      - '.github/workflows/emmana-nec2.yml'

jobs:
  nec2-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: EMMana-Next
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical/reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 libboost-dev libeigen3-dev liblapack-dev nec2c
          nec2c -v || true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEMNEXT_REQUIRE_EIGEN=ON -DEMNEXT_REQUIRE_LAPACK=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Internal regression gates
        run: |
          chmod +x tests/fake_nec2c.py
          ctest --test-dir build --output-on-failure
      - name: Real NEC2 cross-solver suite
        run: python3 tools/run_nec2_suite.py --root . --emnext build/emnext --engine nec2c --json-report benchmarks/NEC2_REAL_CROSS_SOLVER.json
      - name: Upload reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmana-nec2-cross-solver
          path: EMMana-Next/benchmarks/NEC2_REAL_CROSS_SOLVER.json
          if-no-files-found: warn
