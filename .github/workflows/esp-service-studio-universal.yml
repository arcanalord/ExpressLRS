name: ESP Service Studio Universal Pixel 7a

on:
  push:
    branches:
      - esp-service-studio-universal
    paths:
      - 'tools/esp-service-studio-universal/**'
      - '.github/workflows/esp-service-studio-universal.yml'
  workflow_dispatch:

concurrency:
  group: esp-service-studio-universal
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Flutter shell
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.arcanalord --project-name service_studio /tmp/service_studio
          cp -a tools/esp-service-studio-universal/source_overlay/. /tmp/service_studio/
          rm -rf /tmp/service_studio/test
          mkdir -p /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio
          mkdir -p /tmp/service_studio/android/app/src/main/res/xml
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/MainActivity.kt              /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/MainActivity.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/UsbSerialProbe.kt              /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/UsbSerialProbe.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/OfficialElrsService.kt              /tmp/service_studio/android/app/src/main/kotlin/com/arcanalord/service_studio/OfficialElrsService.kt
          cp tools/esp-service-studio-universal/source_overlay/android_overlay/device_filter.xml              /tmp/service_studio/android/app/src/main/res/xml/device_filter.xml
          cd /tmp/service_studio
          python3 android_overlay/patch_android.py

      - name: Dependencies
        working-directory: /tmp/service_studio
        run: flutter pub get

      - name: Toolchain VM gate
        working-directory: /tmp/service_studio
        run: |
          set -euo pipefail
          flutter --version
          flutter doctor -v
          cd android
          ./gradlew --version
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Profile self test
        working-directory: /tmp/service_studio
        run: dart run tool/profile_self_test.dart

      - name: USB serial + pinned ELRS bundle + guarded ESP8285 flash gate
        working-directory: /tmp/service_studio
        run: python3 tool/usb_serial_probe_source_gate.py

      - name: Pinned ExpressLRS bundle contract
        working-directory: /tmp/service_studio
        run: python3 tool/elrs_pinned_bundle_contract_test.py

      - name: ESP8285 ROM protocol contract
        working-directory: /tmp/service_studio
        run: python3 tool/rom_protocol_contract_test.py

      - name: Analyze
        working-directory: /tmp/service_studio
        run: flutter analyze

      - name: Build Pixel 7a APK
        working-directory: /tmp/service_studio
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify APK
        working-directory: /tmp/service_studio
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          cp "$APK" /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-Pixel7a.apk
          sha256sum /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-Pixel7a.apk > /tmp/SHA256SUMS.txt

      - name: Build x86_64 emulator APK
        working-directory: /tmp/service_studio
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-x86_64-test.apk

      - name: Package Dropbox release
        run: |
          set -euo pipefail
          mkdir -p /tmp/service-studio-release
          cp /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-Pixel7a.apk /tmp/service-studio-release/
          cp /tmp/SHA256SUMS.txt /tmp/service-studio-release/
          cp tools/esp-service-studio-universal/README.md /tmp/service-studio-release/
          cp tools/esp-service-studio-universal/ARCHITECTURE_v1.md /tmp/service-studio-release/
          cp tools/esp-service-studio-universal/source_overlay/assets/device_profiles.json /tmp/service-studio-release/
          cd tools/esp-service-studio-universal
          zip -qr /tmp/service-studio-release/ESP-Service-Studio-Universal-source-v0.9.0-alpha.12.zip source_overlay
          cd /tmp/service-studio-release
          zip -qr /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-release.zip .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Service-Studio-Universal-v0.9.0-alpha.12
          path: |
            /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-release.zip
            /tmp/service-studio-release/ESP-Service-Studio-Universal-v0.9.0-alpha.12-Pixel7a.apk
            /tmp/service-studio-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Android 15 API 35 emulator smoke test
        timeout-minutes: 12
        working-directory: /tmp/service_studio
        run: |
          set -euo pipefail
          mkdir -p /tmp/esp-emulator-evidence

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          IMAGE="system-images;android-35;google_apis;x86_64"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "emulator" "$IMAGE"

          echo no | "$AVDMANAGER" create avd             --force             --name ESPStudio_API35             --package "$IMAGE"             --device "pixel_7"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             -avd ESPStudio_API35             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -wipe-data             -gpu swiftshader_indirect             > /tmp/esp-emulator-evidence/emulator.log 2>&1 &

          "$ADB" wait-for-device

          booted=""
          for i in $(seq 1 90); do
            booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$booted" = "1" ] && break
            sleep 4
          done
          [ "$booted" = "1" ]

          "$ADB" shell input keyevent 82 || true
          "$ADB" install -r /tmp/ESP-Service-Studio-Universal-v0.9.0-alpha.12-x86_64-test.apk

          "$ADB" shell dumpsys package com.arcanalord.service_studio             > /tmp/esp-emulator-evidence/package.txt
          grep -F "versionName=0.9.0-alpha.11" /tmp/esp-emulator-evidence/package.txt
          grep -F "versionCode=26092612" /tmp/esp-emulator-evidence/package.txt

          "$ADB" logcat -c
          "$ADB" shell am force-stop com.arcanalord.service_studio
          "$ADB" shell am start -W -n com.arcanalord.service_studio/.MainActivity             | tee /tmp/esp-emulator-evidence/am-start.txt

          sleep 4
          "$ADB" shell pidof com.arcanalord.service_studio             | tee /tmp/esp-emulator-evidence/pid.txt
          test -s /tmp/esp-emulator-evidence/pid.txt

          "$ADB" shell uiautomator dump /sdcard/esp_ui_1.xml >/dev/null
          "$ADB" pull /sdcard/esp_ui_1.xml /tmp/esp-emulator-evidence/ui_1.xml >/dev/null
          "$ADB" exec-out screencap -p > /tmp/esp-emulator-evidence/screen_1.png

          "$ADB" shell input swipe 500 1500 500 300 500 || true
          sleep 2
          "$ADB" shell uiautomator dump /sdcard/esp_ui_2.xml >/dev/null
          "$ADB" pull /sdcard/esp_ui_2.xml /tmp/esp-emulator-evidence/ui_2.xml >/dev/null
          "$ADB" exec-out screencap -p > /tmp/esp-emulator-evidence/screen_2.png

          cat /tmp/esp-emulator-evidence/ui_1.xml /tmp/esp-emulator-evidence/ui_2.xml             > /tmp/esp-emulator-evidence/ui_all.xml
          grep -F "ESP Service Studio" /tmp/esp-emulator-evidence/ui_all.xml
          grep -F "ELRS оборудование" /tmp/esp-emulator-evidence/ui_all.xml

          "$ADB" logcat -d > /tmp/esp-emulator-evidence/logcat.txt
          if grep -E "FATAL EXCEPTION|Process: com\.arcanalord\.service_studio.*has died"             /tmp/esp-emulator-evidence/logcat.txt; then
            echo "Application crash detected"
            exit 1
          fi


      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Service-Studio-Universal-v0.9.0-alpha.12-emulator-evidence
          path: /tmp/esp-emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
