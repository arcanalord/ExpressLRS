name: RF Finder Fusion 3

on:
  push:
    branches:
      - rf-finder-fusion3-test
    paths:
      - 'rf_finder/firmware/**'
      - 'rf_finder/android/**'
      - '.github/workflows/rf-finder-v062.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Web UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('rf_finder/android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8
          b=s.index('</script>',a)
          Path('/tmp/rf_finder_ui.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/rf_finder_ui.js
          node --check rf_finder/android/app/src/main/assets/measurements.js
          node --check rf_finder/android/app/src/main/assets/fusion-solver.js
          node --check rf_finder/android/app/src/main/assets/sx1280-protocol.js
          node --check rf_finder/android/app/src/main/assets/fusion-sim.js
          node --check rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'LocationAwareActivity' rf_finder/android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' rf_finder/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' rf_finder/android/app/src/main/AndroidManifest.xml
          grep -q "versionName '0.7.0-fusion3.4'" rf_finder/android/app/build.gradle
          grep -q 'FUSION 3' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'A↔T RANGE' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'B↔T RANGE' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'TARGET ID' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'window.onFusionRange' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'measurements.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          grep -q 'fusion-solver.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          grep -q 'sx1280-protocol.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          grep -q 'fusion-sim.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          grep -q 'fusion3.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          grep -q 'СИМУЛЯТОР / REPLAY' rf_finder/android/app/src/main/assets/fusion3.js
          grep -q 'WLS_ENU' rf_finder/android/app/src/main/assets/fusion-solver.js
          grep -q 'F3,RANGE' rf_finder/protocol/FUSION3_SX1280_PROTOCOL.md
          g++ -std=c++17 -Wall -Wextra -pedantic -I. rf_finder/sx1280_fusion/test_protocol.cpp -o /tmp/fusion3_protocol_test
          /tmp/fusion3_protocol_test

          node - <<'NODE'
          global.window=global;
          require('./rf_finder/android/app/src/main/assets/sx1280-protocol.js');
          const P=RFFusionProtocol;
          const line=P.lineRange({sessionId:'S1',sequence:7,from:'A',to:'T',targetId:'T-001',timestamp:1234,rangeRawM:42.4,rangeM:42.1,sigmaM:.8,quality:.91,rssiDbm:-68,txPowerDbm:10,losState:'LOS',calibrationId:'CAL-1',flags:['TEST']});
          const m=P.parseLine(line);
          if(!m.ok||m.type!=='RANGE') throw new Error('range parse failed');
          if(Math.abs(m.rangeM-42.1)>.001||m.from!=='A'||m.to!=='T'||m.targetId!=='T-001') throw new Error('range round-trip mismatch');
          const reg=new P.Registry();
          if(!reg.accept(m).accepted) throw new Error('first range rejected');
          if(reg.accept(m).accepted) throw new Error('duplicate range accepted');
          const hello=P.parseLine(P.lineHello({deviceId:'A-001',role:'COORDINATOR',fw:'0.1',sessionId:'S1',caps:['RANGING']}));
          if(!hello.ok||hello.role!=='COORDINATOR') throw new Error('hello round-trip failed');
          console.log('Fusion3 protocol round-trip OK', line);
          NODE

          node - <<'NODE'
          global.window=global;
          require('./rf_finder/android/app/src/main/assets/measurements.js');
          require('./rf_finder/android/app/src/main/assets/fusion-solver.js');
          require('./rf_finder/android/app/src/main/assets/fusion-sim.js');
          function run(name, extra) {
            const s=RFFusionSim.generate(name,Object.assign({seed:42,bearingSigmaDeg:1.5,rangeSigmaM:.5,origin:{lat:.01,lon:.01},targetId:'T-001'},extra||{}));
            const r=RFFusionSolver.solve({
              targetId:'T-001',
              anchors:{A:s.poses.A,B:s.poses.B},
              bearings:[Object.assign({anchorId:'A'},s.bearings.A),Object.assign({anchorId:'B'},s.bearings.B)],
              ranges:[s.ranges.AT,s.ranges.BT],
              now:Date.now(),maxAgeMs:5000
            });
            if(!r.ok) throw new Error(name+' solve failed: '+r.reason);
            const truth=s.truth.latLonT, R=6371000, p=(truth.lat+r.lat)/2*Math.PI/180;
            const err=Math.hypot((r.lon-truth.lon)*Math.PI/180*R*Math.cos(p),(r.lat-truth.lat)*Math.PI/180*R);
            console.log(name, 'error_m', err.toFixed(3), 'sigma', r.sigmaMajorM.toFixed(3), 'geometry', r.geometry);
            if(name==='GOOD' && err>8) throw new Error('GOOD error too high '+err);
            return {r,err};
          }
          run('GOOD');
          run('WIDE');
          const nlos=run('GOOD',{nlos:true});
          if(!Number.isFinite(nlos.r.sigmaMajorM)) throw new Error('NLOS uncertainty missing');
          NODE

          ! grep -q 'location.js' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationBridge.java
          ! grep -q 'java.lang.reflect.Field' rf_finder/android/app/src/main/java/ru/fpvclub/rangerrf/LocationAwareActivity.java

      - name: RX-only invariant
        shell: bash
        run: |
          set -euo pipefail
          F=rf_finder/firmware/src/main.cpp
          if grep -E 'SET_TX|TX_DONE|SET_PA|OUTPUT_POWER|SET_TX_CW|startCW|CommitOutputPower' "$F"; then
            echo 'TX path token found in RF Finder firmware'
            exit 1
          fi
          grep -q 'WiFi.mode(WIFI_OFF)' "$F"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        working-directory: rf_finder/firmware
        run: pio run -e rf_finder_lr1121_c3

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android
        working-directory: rf_finder/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp rf_finder/firmware/.pio/build/rf_finder_lr1121_c3/firmware.bin out/RF_Finder_DAKERFPV_LR1121_v0.6.2-dev1.bin
          cp rf_finder/android/app/build/outputs/apk/debug/app-debug.apk out/RF_Finder_Fusion3_v0.7.0-fusion3.4-debug.apk
          mkdir -p out/protocol out/core
          cp rf_finder/protocol/FUSION3_SX1280_PROTOCOL.md out/protocol/
          cp rf_finder/sx1280_fusion/fusion3_protocol.h out/protocol/
          cp rf_finder/sx1280_fusion/fusion3_controller.h out/protocol/
          cp rf_finder/android/app/src/main/assets/sx1280-protocol.js out/core/
          cp rf_finder/android/app/src/main/assets/measurements.js out/core/
          cp rf_finder/android/app/src/main/assets/fusion-solver.js out/core/
          cd out
          sha256sum RF_Finder_DAKERFPV_LR1121_v0.6.2-dev1.bin RF_Finder_Fusion3_v0.7.0-fusion3.3-debug.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: RF-Finder-Fusion3-v0.7.0-fusion3.4
          path: out/*

# Fusion 3 A/B/T validation
