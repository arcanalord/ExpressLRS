name: Radio Horizon APK Temp Build
on:
  push:
    branches: ["ci-radio-horizon-apk-v030"]
    paths:
      - "tools/radio-horizon-ci/**"
      - ".github/workflows/radio-horizon-apk-temp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rehydrate source
        run: |
          cat tools/radio-horizon-ci/source.part.* > source.b64
          base64 -d source.b64 > source.tar.gz
          mkdir -p tools/radio-horizon
          tar -xzf source.tar.gz -C tools/radio-horizon
      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run core tests
        working-directory: tools/radio-horizon
        run: node --test tests/*.test.mjs
      - name: Build debug APK
        working-directory: tools/radio-horizon/android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-horizon-v0.3.0-debug-apk
          path: tools/radio-horizon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
