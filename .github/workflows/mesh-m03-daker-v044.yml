name: Mesh M03 DAKER LR1121 v0.4.4-dev

on:
  push:
    branches:
      - build/mesh-m03-dakefpv-lr1121-v0.4.4-dev
    paths:
      - '.ci/m03-v044-src/**'
      - '.github/workflows/mesh-m03-daker-v044.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Static target gate
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/m03-v044-src
          grep -q 'MM_BOARD_DAKERFPV_NANO_C3' platformio.ini
          grep -q 'MM_RADIO_LR1121' platformio.ini
          grep -q 'PIN_RST = 2' include/boards/dakerfpv_nano_c3_lr1121.h
          grep -q 'HOST_UART_RX = 20' include/boards/dakerfpv_nano_c3_lr1121.h
          grep -q 'setRegulatorDCDC' src/radio_adapter.cpp
          grep -q 'setRfSwitchTable' src/radio_adapter.cpp
          grep -q 'MODE_TX_HF' src/radio_adapter.cpp
          grep -q 'BW_KHZ=812.5f' include/target_config.h
          grep -q '#undef LINK_STATS' include/mm_uart.h

      - name: Host protocol compile gate
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/m03-v044-src
          g++ -std=c++17 -Iinclude -c src/mm_uart.cpp -o /tmp/mm_uart.o
          g++ -std=c++17 -Iinclude -c src/mmrp_packet.cpp -o /tmp/mmrp_packet.o

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build DAKERFPV Nano C3 LR1121
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/m03-v044-src
          pio run -e mmfw_dakerfpv_nano_c3_lr1121

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SRC=.ci/m03-v044-src
          BIN="$SRC/.pio/build/mmfw_dakerfpv_nano_c3_lr1121/firmware.bin"
          cp "$BIN" out/DAKERFPV-Nano-C3-LR1121-M03-v0.4.4-dev.bin
          python -m esptool image_info out/DAKERFPV-Nano-C3-LR1121-M03-v0.4.4-dev.bin
          (cd "$SRC" && zip -qr ../../../out/M03-ER-FW-FRAMEWORK-v0.4.4-dev-DAKERFPV-SOURCE.zip . -x '.pio/*')
          cat > out/QA_REPORT_v0.4.4-dev.md <<'EOF'
          # Mesh Messenger M03 v0.4.4-dev - DAKERFPV Nano C3 LR1121
          CI BUILD PASS.
          Target: ESP32-C3 + LR1121.
          Board pins: RX20 TX21 MISO5 MOSI4 SCK6 BUSY3 DIO1=1 NSS7 RST2.
          LR1121: DCDC enabled; internal DIO5-DIO8 RF-switch table configured.
          PHY candidate: 2440 MHz, LoRa BW 812.5 kHz, SF8, CR 4/7, private sync, preamble 12.
          MM-UART/1 + MMRP/1 host compile gate: PASS.
          ESP32-C3 PlatformIO build: PASS.
          esptool image_info: PASS.
          Physical DAKER UART/RF HIL: PENDING.
          Cross-radio EP2/SX1280 <-> DAKER/LR1121 HIL: PENDING.
          EOF
          (cd out && sha256sum DAKERFPV-Nano-C3-LR1121-M03-v0.4.4-dev.bin M03-ER-FW-FRAMEWORK-v0.4.4-dev-DAKERFPV-SOURCE.zip > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: M03-DAKER-LR1121-v0.4.4-dev
          path: out/*
