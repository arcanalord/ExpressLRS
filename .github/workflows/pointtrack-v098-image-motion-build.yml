name: PointTrack Android v0.9.8 image motion

on:
  push:
    branches: [pointtrack-android-v0.9.8-image-motion]
    paths:
      - 'pointtrack_ci/v095_parts/**'
      - 'pointtrack_ci/v097_apply.py'
      - 'pointtrack_ci/v098_apply.py'
      - 'pointtrack_ci/v098/**'
      - '.github/workflows/pointtrack-v098-image-motion-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: PointTrack v0.9.8 image motion Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Restore exact clean v0.9.5 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat pointtrack_ci/v095_parts/part.* > "$RUNNER_TEMP/PointTrack_v0.9.5-dev_android_source.zip"
          echo "19d22cda0c0dbdd49a0dcf6233cc9f1dafdca72ea89370e6d29e59b775df7259  $RUNNER_TEMP/PointTrack_v0.9.5-dev_android_source.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pointtrack"
          unzip -q "$RUNNER_TEMP/PointTrack_v0.9.5-dev_android_source.zip" -d "$RUNNER_TEMP/pointtrack"
          test -f "$RUNNER_TEMP/pointtrack/settings.gradle.kts"
          test "$(cat "$RUNNER_TEMP/pointtrack/VERSION")" = "0.9.5-dev"
          echo "PT=$RUNNER_TEMP/pointtrack" >> "$GITHUB_ENV"

      - name: Apply v0.9.6 every-frame image-motion fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import os; p=Path(os.environ["PT"])/"androidApp/src/main/java/com/fpvclub/pointtrack/TrackerRuntime.kt"; s=p.read_text(); old="val estimateMotion = (trackValid || command is TrackerCommand.Lock) && !skipThisPatchMotionFrame"; new="val estimateMotion = trackValid || command is TrackerCommand.Lock"; assert old in s; p.write_text(s.replace(old,new,1))'
          printf '0.9.6-dev\n' > "$PT/VERSION"

      - name: Apply v0.9.7 acquisition fix
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/pointtrack_ci/v097_apply.py" "$PT"
          test "$(cat "$PT/VERSION")" = "0.9.7-dev"

      - name: Apply v0.9.8 image-only rotation compensation
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/pointtrack_ci/v098_apply.py" "$PT" "$GITHUB_WORKSPACE"
          test "$(cat "$PT/VERSION")" = "0.9.8-dev"
          test -f "$PT/core/src/main/kotlin/com/pointtrack/core/GlobalImageMotionStabilizer.kt"
          test ! -e "$PT/core/src/main/kotlin/com/pointtrack/core/GlobalTranslationStabilizer.kt"
          ! grep -RniE '\bgyro\b|gyroscope|\bimu\b' "$PT/androidApp/src/main/java" "$PT/core/src/main/kotlin"
          grep -F "bright-on-dark PATCH polarity regression" "$PT/core/src/test/kotlin/com/pointtrack/core/CoreRegression.kt"
          grep -F "image-only rotation model regression" "$PT/core/src/test/kotlin/com/pointtrack/core/CoreRegression.kt"

      - name: Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$PT"
          gradle --no-daemon :core:coreRegression --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PT"
          gradle --no-daemon :androidApp:assembleDebug --stacktrace

      - name: Package source and APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out/android" "$GITHUB_WORKSPACE/out/source"
          SRC="$PT/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SRC" | grep "package: name='com.fpvclub.pointtrack'"
          cp "$SRC" "$GITHUB_WORKSPACE/out/android/PointTrack_v0.9.8-dev-image-motion-debug.apk"
          (
            cd "$PT"
            zip -qr "$GITHUB_WORKSPACE/out/source/PointTrack_v0.9.8-dev_android_source.zip" . -x '*/build/*' '.gradle/*' '*/.gradle/*'
          )
          sha256sum "$GITHUB_WORKSPACE"/out/android/* "$GITHUB_WORKSPACE"/out/source/* | tee "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: PointTrack-v0.9.8-dev-image-motion
          path: |
            out/android/*
            out/source/*
            out/SHA256SUMS.txt
          retention-days: 14
