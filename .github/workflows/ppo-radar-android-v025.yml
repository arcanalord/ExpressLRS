name: PPO Radar Android v0.2.5 APK

on:
  push:
    branches: [ build/ppo-radar-android-v025 ]
    paths:
      - ".github/workflows/ppo-radar-android-v025.yml"
      - "ppo-radar-ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppo-radar-android-v025
  cancel-in-progress: true

env:
  DROPBOX_FOLDER_URL: https://www.dropbox.com/scl/fo/gca5cqopw6r0b194shp0z/ACc1Sa9cLgqFvlVcbpLv9-0?rlkey=zo23mjd3x6bm73u2rx8oy1pg4&st=n7jcdyy8&dl=1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Restore v0.2.5 from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _ppo
          mkdir -p _ppo/dropbox _ppo/unpacked _ppo/out
          curl -L --fail --retry 3 "$DROPBOX_FOLDER_URL" -o _ppo/dropbox.zip
          unzip -q _ppo/dropbox.zip -d _ppo/dropbox
          PROJECT_ZIP="$(find _ppo/dropbox -type f -name 'PPO_RADAR_ANDROID_v0.2.5_PROJECT.zip' -print -quit)"
          SOURCE_ZIP="$(find _ppo/dropbox -type f -name 'SOURCE_CURRENT_v0.2.5.zip' -print -quit)"
          test -n "$PROJECT_ZIP"; test -n "$SOURCE_ZIP"
          sha256sum "$PROJECT_ZIP" | tee _ppo/out/ANDROID_PROJECT_SHA256.txt
          sha256sum "$SOURCE_ZIP" | tee _ppo/out/SOURCE_SHA256_FROM_DROPBOX.txt
          unzip -q "$PROJECT_ZIP" -d _ppo/unpacked
          ANDROID_DIR="$(find _ppo/unpacked -type f -path '*/app/build.gradle' -printf '%h
' | sed 's#/app$##' | head -n1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          test -f "$ANDROID_DIR/app/src/main/assets/web/index.html"
          grep -q "0.2.5" "$ANDROID_DIR/app/src/main/assets/web/src/version.js"

      - name: Validate shared runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR/app/src/main/assets/web"
          npm test
          node --check src/app.js
          node --check src/offline-map-download.js
          node --check src/offline-map-manager.js

      - name: Build Android APK
        run: gradle -p "$ANDROID_DIR" --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          zipalign -c -v 4 "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee _ppo/out/APK_SIGNATURE.txt
          aapt dump badging "$APK" | tee _ppo/out/AAPT_BADGING.txt
          grep -q "package: name='ru.fpvclub.pporadar'" _ppo/out/AAPT_BADGING.txt
          grep -q "versionCode='25'" _ppo/out/AAPT_BADGING.txt
          grep -q "versionName='0.2.5'" _ppo/out/AAPT_BADGING.txt
          unzip -l "$APK" | tee _ppo/out/APK_CONTENTS.txt
          grep -q "assets/web/index.html" _ppo/out/APK_CONTENTS.txt
          grep -q "assets/web/vendor/maplibre-gl.mjs" _ppo/out/APK_CONTENTS.txt
          grep -q "assets/web/vendor/pmtiles.js" _ppo/out/APK_CONTENTS.txt
          cp "$APK" _ppo/out/PPO_RADAR_v0.2.5-debug.apk
          sha256sum _ppo/out/PPO_RADAR_v0.2.5-debug.apk | tee _ppo/out/APK_SHA256.txt
          cat > _ppo/out/BUILD_RESULT.txt <<'EOF'
version=0.2.5
version_code=25
runtime_regression=PASS
android_build=PASS
zipalign=PASS
apksigner=PASS
aapt_badging=PASS
offline_runtime_assets=PASS
phone_install=PENDING
phone_offline_pmtiles=PENDING
EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ppo-radar-v0.2.5-debug
          path: _ppo/out/*
          retention-days: 30
