name: PointTrack Android v0.9.2.1

on:
  push:
    branches:
      - pointtrack-android-v0.9.2-dev
    paths:
      - 'pointtrack_ci/**'
      - '.github/workflows/pointtrack-v092-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: PointTrack Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore PointTrack source and apply v0.9.2.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          cat pointtrack_ci/source.b64.* | base64 -d > "$RUNNER_TEMP/PointTrack_v0.9.2-dev_android_source.zip"
          unzip -t "$RUNNER_TEMP/PointTrack_v0.9.2-dev_android_source.zip"
          mkdir -p "$RUNNER_TEMP/pointtrack"
          unzip -q "$RUNNER_TEMP/PointTrack_v0.9.2-dev_android_source.zip" -d "$RUNNER_TEMP/pointtrack"
          test -f "$RUNNER_TEMP/pointtrack/settings.gradle.kts"
          cp pointtrack_ci/TrackingOverlayView.kt "$RUNNER_TEMP/pointtrack/androidApp/src/main/java/com/fpvclub/pointtrack/TrackingOverlayView.kt"
          cp pointtrack_ci/v0921_Config.kt "$RUNNER_TEMP/pointtrack/core/src/main/kotlin/com/pointtrack/core/Config.kt"
          cp pointtrack_ci/v0921_PointTracker.kt "$RUNNER_TEMP/pointtrack/core/src/main/kotlin/com/pointtrack/core/PointTracker.kt"
          cp pointtrack_ci/v0921_PointTrackEngine.kt "$RUNNER_TEMP/pointtrack/core/src/main/kotlin/com/pointtrack/core/PointTrackEngine.kt"
          cp pointtrack_ci/v0921_TrackerRuntime.kt "$RUNNER_TEMP/pointtrack/androidApp/src/main/java/com/fpvclub/pointtrack/TrackerRuntime.kt"
          cp pointtrack_ci/v0921_androidApp.build.gradle.kts "$RUNNER_TEMP/pointtrack/androidApp/build.gradle.kts"
          echo "0.9.2.1-dev" > "$RUNNER_TEMP/pointtrack/VERSION"
          echo "PT=$RUNNER_TEMP/pointtrack" >> "$GITHUB_ENV"

      - name: Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$PT"
          gradle --no-daemon :core:coreRegression --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PT"
          gradle --no-daemon :androidApp:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/pointtrack-build.log"

      - name: Save build failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/pointtrack-build.log" || exit 0
          mkdir -p ci_logs
          tail -n 300 "$RUNNER_TEMP/pointtrack-build.log" > ci_logs/pointtrack-v0921-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci_logs/pointtrack-v0921-build.log
          git commit -m 'ci: save PointTrack v0.9.2.1 build failure log' || exit 0
          git push origin HEAD:pointtrack-android-v0.9.2-dev

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PT/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SRC" | grep "package: name='com.fpvclub.pointtrack'"
          mkdir -p out/android
          cp "$SRC" out/android/PointTrack_v0.9.2.1-dev-debug.apk
          sha256sum out/android/PointTrack_v0.9.2.1-dev-debug.apk | tee out/android/PointTrack_v0.9.2.1-dev-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: PointTrack-v0.9.2.1-dev-Android
          path: out/android/*
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='pointtrack-v0.9.2.1-dev-android'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/android/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/android/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'PointTrack v0.9.2.1-dev Android' \
              --notes 'Tracking retention hotfix: real-target-only lock initialization, wider initial/locked/coast/search gates, velocity-adaptive association, longer coast/search, larger lock ROI.'
          fi
