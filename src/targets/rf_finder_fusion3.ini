# RF Finder Fusion 3 standalone bench targets.
# These do NOT run normal ExpressLRS RX/TX application code.

[rf_fusion3_esp32s3_base]
extends = env_common_esp32s3rx, radio_2400
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    ${env_common_esp32s3rx.build_flags}
    ${radio_2400.build_flags}
    ${common_env_data.build_flags_rx}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D RF_FUSION3_BENCH=1
    -I../rf_finder/sx1280_fusion
    -include target/RF_Fusion3_ESP32S3_Zero.h
build_src_filter =
    ${common_env_data.build_src_filter}
    -<rx_main.cpp>
    -<tx_main.cpp>
    -<common.cpp>
    -<rxtx_common.cpp>
    -<test_main.cpp>
    +<rf_fusion3_bench_main.cpp>

[env:RF_Fusion3_SX1280_A_ESP32S3]
extends = rf_fusion3_esp32s3_base
build_flags =
    ${rf_fusion3_esp32s3_base.build_flags}
    -D RF_FUSION3_NODE_A=1

[env:RF_Fusion3_SX1280_T_ESP32S3]
extends = rf_fusion3_esp32s3_base
build_flags =
    ${rf_fusion3_esp32s3_base.build_flags}
    -D RF_FUSION3_NODE_T=1
